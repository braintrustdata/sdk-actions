# GENERATED by scripts/generate.rb — edit templates/, not this file.
# sdk-actions: {"family":"release","version":"1.0.0"}
name: Validate Python Release
description: >
  Judges a Python release against the facts `configure` derived — the toggleable checks
  (tag unused, version unpublished on PyPI, notes present, release branch) — and runs a
  pre-gate build + CycloneDX SBOM generation so build/SBOM-tooling failures surface
  BEFORE the approval gate. Read-only: nothing is signed or published here. Every check
  is a boolean toggle (default on) with an escape hatch. Consumes `configure`'s
  `already_published` fact (does not query PyPI itself).

inputs:
  sha:
    description: "Commit SHA being released"
    required: true
  dry_run:
    description: "Warn instead of failing on an already-existing tag / already-published version"
    required: false
    default: 'false'
  working_directory:
    description: "Path to the package root (where pyproject.toml lives)"
    required: false
    default: '.'
  python_version:
    description: >
      Python version (e.g. 3.13), or a path to a version file
      (.python-version, .tool-versions) relative to the repo root.
    required: true
  release_tag:
    description: "The release tag (from configure) — checked for prior existence"
    required: true
  on_release_branch:
    description: "Whether the SHA is on an allowed release branch (from configure)"
    required: false
    default: 'true'
  notes:
    description: "Base64-encoded release notes (from prepare) — checked non-blank"
    required: false
    default: ''
  already_published:
    description: "Whether the version is already on PyPI (from configure). Judged by check_version_unpublished."
    required: false
    default: ''
  build_command:
    description: "Override build command. When empty, `uv build` is used."
    required: false
    default: ''
  build:
    description: >
      Build the distribution as a pre-gate check. Set to 'false' in the custom-build
      shape, where the pack job owns the build.
    required: false
    default: 'true'
  sbom:
    description: >
      Generate a CycloneDX SBOM as a pre-gate check (same generator as build-and-ship),
      so SBOM-tooling failures surface BEFORE the approval gate. Not signed or attached
      here — that happens in build-and-ship.
    required: false
    default: 'true'
  check_tag_unused:
    description: "Fail if the release tag already exists"
    required: false
    default: 'true'
  check_version_unpublished:
    description: "Fail if the version is already published to PyPI (judges configure's already_published)"
    required: false
    default: 'true'
  check_notes_not_blank:
    description: "Warn if release notes are blank"
    required: false
    default: 'true'
  enforce_release_branch:
    description: "Hard-fail (instead of warn) when the SHA is off the release branch"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ inputs.sha }}
        fetch-depth: 0

    - name: Resolve Python version source
      id: py-src
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python_version }}
      run: |
        # python_version is either an explicit version (e.g. 3.13) or a path to a
        # version file (.python-version / .tool-versions). Route by file existence.
        if [ -n "$PYTHON_VERSION" ] && [ -f "$PYTHON_VERSION" ]; then
          case "$PYTHON_VERSION" in
            *.tool-versions) SPEC=$(awk '/^python /{print $2; exit}' "$PYTHON_VERSION") ;;
            *)               SPEC=$(head -1 "$PYTHON_VERSION" | tr -d '[:space:]') ;;
          esac
        else
          SPEC="$PYTHON_VERSION"
        fi
        echo "spec=$SPEC" >> "$GITHUB_OUTPUT"

    - name: Set up uv
      uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7.2.0
      with:
        # Installs this Python and exports UV_PYTHON for the job, so subsequent uv
        # commands (build, read-version) use it.
        python-version: ${{ steps.py-src.outputs.spec }}
        # Don't fail the job when there's nothing to cache (jobs that install no deps).
        ignore-nothing-to-cache: "true"

    - name: Check release
      shell: bash
      env:
        TAG: ${{ inputs.release_tag }}
        DRY_RUN: ${{ inputs.dry_run }}
        ON_RELEASE_BRANCH: ${{ inputs.on_release_branch }}
        NOTES_B64: ${{ inputs.notes }}
        CHECK_TAG_UNUSED: ${{ inputs.check_tag_unused }}
        CHECK_NOTES: ${{ inputs.check_notes_not_blank }}
        ENFORCE_RELEASE_BRANCH: ${{ inputs.enforce_release_branch }}
        CHECK_VERSION_UNPUBLISHED: ${{ inputs.check_version_unpublished }}
        ALREADY_PUBLISHED: ${{ inputs.already_published }}
      run: |
        # Version not already published on the registry (fact from configure's availability check;
        # covers prereleases, which aren't git-tagged). Warn (not fail) on a dry run.
        if [ "$CHECK_VERSION_UNPUBLISHED" = "true" ] && [ "$ALREADY_PUBLISHED" = "true" ]; then
          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning title=Version already published::the version is already on the registry — skipping in dry run."
          else
            echo "::error title=Version already published::the version is already on the registry — has the version been bumped?"
            exit 1
          fi
        fi

        # Tag not already used (covers stable releases; prereleases are covered by the availability check)
        if [ "$CHECK_TAG_UNUSED" = "true" ] && git rev-parse "$TAG" >/dev/null 2>&1; then
          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning title=Release tag already exists::Tag $TAG already exists — skipping in dry run."
          else
            echo "::error title=Release tag already exists::Tag $TAG already exists — has the version been bumped?"
            exit 1
          fi
        fi

        # On a release branch: warn by default, hard-fail only when enforced.
        if [ "$ON_RELEASE_BRANCH" = "false" ]; then
          if [ "$ENFORCE_RELEASE_BRANCH" = "true" ]; then
            echo "::error title=Off release branch::the release SHA is not on an allowed release branch (enforce_release_branch=true)."
            exit 1
          else
            echo "::warning title=Off release branch::the release SHA is not on an allowed release branch — releasing anyway."
          fi
        fi

        # Release notes present (warn only — a genuine first release, or no PRs since the last tag, is legitimate).
        if [ "$CHECK_NOTES" = "true" ]; then
          NOTES=$(echo "$NOTES_B64" | base64 -d 2>/dev/null || echo "")
          if [ -z "$NOTES" ]; then
            echo "::warning title=Empty release notes::no release notes were generated (first release, or no PRs since the last tag?)."
          fi
        fi

    - name: Build distribution
      if: ${{ inputs.build == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        BUILD_COMMAND: ${{ inputs.build_command }}
      run: |
        rm -rf dist
        if [ -n "$BUILD_COMMAND" ]; then
          echo "Running custom build: $BUILD_COMMAND"
          eval "$BUILD_COMMAND"
        else
          uv build
        fi
        uvx twine check dist/*

    - name: Generate SBOM (CycloneDX)
      if: ${{ inputs.sbom == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        # cyclonedx-py can't read uv lockfiles, so scan the wheel's installed closure:
        # install the built wheel into a throwaway venv, then generate from that env.
        SBOM_VENV="$(mktemp -d)/venv"
        uv venv "$SBOM_VENV"
        uv pip install --python "$SBOM_VENV/bin/python" dist/*.whl
        # NB: do NOT add --output-reproducible — it strips serialNumber (and the timestamp),
        # and actions/attest requires serialNumber to recognize the SBOM as CycloneDX.
        uvx --from "cyclonedx-bom==7.3.0" cyclonedx-py environment "$SBOM_VENV" \
          --spec-version 1.7 --output-format JSON --output-file sbom.raw.json

        # Promote the built package to the SBOM subject: the env scan leaves it in
        # `components` with no purl and a local build-path ref. Identify it (the only
        # component installed from a local file://), set it as metadata.component with a
        # pkg:pypi purl (normalized: lowercase, '_'->'-'), strip the build-path ref, and
        # drop it from components. Its bom-ref (and the dependencies-graph root) are kept.
        jq '
          def is_local: (.externalReferences // []) | any(.type == "distribution" and ((.url // "") | tostring | startswith("file:")));
          ([.components[] | select(is_local)] | .[0]) as $subj
          | if $subj == null then error("SBOM: could not identify the built package component") else . end
          | ($subj.name | ascii_downcase | gsub("_"; "-")) as $norm
          | .metadata.component = (
              $subj
              | .type = "library"
              | .purl = "pkg:pypi/\($norm)@\($subj.version)"
              | .externalReferences = [ (.externalReferences // [])[] | select(((.url // "") | tostring | startswith("file:")) | not) ]
              | if (.externalReferences | length) == 0 then del(.externalReferences) else . end )
          | .components = [ .components[] | select(.["bom-ref"] != $subj["bom-ref"]) ]
        ' sbom.raw.json > sbom.json
        rm -f sbom.raw.json
        echo "Wrote $(pwd)/sbom.json"

    - name: Dump Python environment
      if: ${{ failure() }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "=== uv / Python ==="
        uv --version || echo "(uv unavailable)"
        uv run --no-project python --version || echo "(python unavailable)"
        echo "=== UV_PYTHON ==="
        echo "${UV_PYTHON:-(unset)}"
        echo "=== Built artifacts ==="
        ls -la dist 2>/dev/null || echo "(no dist/)"
        echo "=== pyproject.toml (release-relevant) ==="
        uv run --no-project python -c '
        import json, tomllib, pathlib
        t = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
        proj = t.get("project", {})
        print(json.dumps({
            "name": proj.get("name"),
            "version": proj.get("version") or ("(dynamic)" if "version" in proj.get("dynamic", []) else None),
            "requires-python": proj.get("requires-python"),
            "dependencies": proj.get("dependencies"),
            "optional-dependencies": sorted((proj.get("optional-dependencies") or {}).keys()),
            "build-system": t.get("build-system"),
        }, indent=2))
        ' 2>/dev/null || echo "(pyproject.toml unavailable)"
