name: Release

# Releases bt-publishing-test to PyPI via braintrustdata/sdk-actions. Dispatch after merging
# the commit that bumps VERSION in src/bt_publishing_test/version.py; the release runs against that commit's SHA.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (stable → GitHub release; prerelease → none)"
        type: choice
        default: stable
        options: [stable, prerelease]
      sha:
        description: "Commit SHA (of the version bump) to release"
        required: true
        type: string
      prev_release:
        description: "Release-notes anchor: a tag or SHA (empty → the previous tag)"
        type: string
        required: false
      dry_run:
        description: "Dry run: build without tagging or publishing"
        type: boolean
        default: false

jobs:
