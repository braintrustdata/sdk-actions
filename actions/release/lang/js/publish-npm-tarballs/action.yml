# GENERATED by scripts/generate.rb — edit templates/, not this file.
# sdk-actions: {"family":"release","version":"1.0.0"}
name: Publish npm Tarballs
description: >
  Gated publish action for manifest-driven npm package releases. Verifies prebuilt
  npm tarball attestations, publishes the exact downloaded tarballs to npmjs with
  OIDC, and posts a concise release summary. It does not build, pack, create
  GitHub releases, or upload SBOM assets.

inputs:
  manifest:
    description: "Path to a release manifest whose packages are already in publish order"
    required: true
  tarballs:
    description: "Space-separated tarball paths or globs"
    required: true
  repo:
    description: "GitHub owner/repo containing the tarball attestations"
    required: false
    default: '${{ github.repository }}'
  provenance:
    description: "Publish with npm-native provenance"
    required: false
    default: 'true'
  channel:
    description: "Default npm dist-tag"
    required: false
    default: 'latest'
  npm_version:
    description: "npm CLI version to install for OIDC trusted publishing"
    required: false
    default: '11.6.2'
  dry_run:
    description: "Skip attestation verification and run npm publish with --dry-run"
    required: false
    default: 'false'
  slack_token:
    description: "Slack bot token"
    required: false
    default: ''
  slack_channel:
    description: "Slack channel ID"
    required: false
    default: ''
  slack_mention:
    description: "Optional Slack handle or group to @mention on completion"
    required: false
    default: ''
  failure_slack_mention:
    description: "Optional Slack handle or group to @mention if publishing fails"
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Verify attestations
      if: ${{ inputs.dry_run != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACTS: ${{ inputs.tarballs }}
        REPO: ${{ inputs.repo }}
      run: |
        shopt -s nullglob
        FILES=( $ARTIFACTS )
        if [ ${#FILES[@]} -eq 0 ]; then
          echo "::error title=Nothing to verify::no artifact files matched '$ARTIFACTS'."
          exit 1
        fi
        for f in "${FILES[@]}"; do
          echo "Verifying $(basename "$f") — build provenance…"
          gh attestation verify "$f" --repo "$REPO" || {
            echo "::error title=Provenance verification failed::no build-provenance attestation matches $(basename "$f") — the artifact was not produced by a trusted build, or was tampered with in transit."
            exit 1
          }
          echo "Verifying $(basename "$f") — SBOM…"
          gh attestation verify "$f" --repo "$REPO" --predicate-type https://cyclonedx.org/bom || {
            echo "::error title=SBOM verification failed::no CycloneDX SBOM attestation matches $(basename "$f")."
            exit 1
          }
        done
        echo "✓ attestations verified for: ${FILES[*]}"

    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: lts/*
        registry-url: https://registry.npmjs.org

    - name: Install npm with OIDC trusted publishing support
      shell: bash
      env:
        NPM_VERSION: ${{ inputs.npm_version }}
      run: npm install -g "npm@$NPM_VERSION"

    - name: Publish tarballs in manifest order
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        TARBALLS: ${{ inputs.tarballs }}
        DEFAULT_CHANNEL: ${{ inputs.channel }}
        DEFAULT_PROVENANCE: ${{ inputs.provenance }}
        DRY_RUN: ${{ inputs.dry_run }}
        REPORT: ${{ runner.temp }}/sdk-actions-publish-npm-tarballs.tsv
        NODE_AUTH_TOKEN: ''
        NPM_TOKEN: ''
      run: |
        set -euo pipefail

        if ! command -v jq >/dev/null 2>&1; then
          echo "::error title=jq not found::publish-npm-tarballs requires jq to read the release manifest."
          exit 1
        fi

        if [ ! -f "$MANIFEST" ]; then
          echo "::error title=Manifest not found::release manifest does not exist: $MANIFEST"
          exit 1
        fi

        shopt -s nullglob
        tarball_files=( $TARBALLS )
        if [ "${#tarball_files[@]}" -eq 0 ]; then
          echo "::error title=No tarballs found::no files matched '$TARBALLS'."
          exit 1
        fi

        : > "$REPORT"

        find_tarball() {
          local expected="$1"
          local matched=()
          for file in "${tarball_files[@]}"; do
            if [ "$(basename "$file")" = "$expected" ]; then
              matched+=("$file")
            fi
          done

          if [ "${#matched[@]}" -ne 1 ]; then
            echo "::error title=Tarball match failed::expected exactly one tarball named $expected, found ${#matched[@]}." >&2
            return 1
          fi

          printf '%s\n' "${matched[0]}"
        }

        packages_tsv="$(mktemp)"
        trap 'rm -f "$packages_tsv"' EXIT

        while IFS= read -r encoded; do
          package_json="$(printf '%s' "$encoded" | base64 -d)"
          name="$(jq -r '.name // empty' <<< "$package_json")"
          version="$(jq -r '.version // empty' <<< "$package_json")"
          expected_tarball="$(jq -r '.tarball_asset // empty' <<< "$package_json")"
          channel="$(jq -r '.channel // empty' <<< "$package_json")"
          provenance="$(jq -r '.provenance // empty' <<< "$package_json")"

          if [ -z "$name" ] || [ -z "$version" ]; then
            echo "::error title=Manifest package invalid::each package must set name and version."
            exit 1
          fi

          if [ -z "$expected_tarball" ]; then
            echo "::error title=Tarball asset missing::manifest package $name@$version must set tarball_asset."
            exit 1
          fi

          if [ "$(basename "$expected_tarball")" != "$expected_tarball" ]; then
            echo "::error title=Invalid tarball asset::tarball_asset must be a file basename, got: $expected_tarball"
            exit 1
          fi

          [ -n "$channel" ] || channel="$DEFAULT_CHANNEL"
          [ -n "$provenance" ] || provenance="$DEFAULT_PROVENANCE"

          tarball="$(find_tarball "$expected_tarball")"
          packed_name="$(tar -xzO -f "$tarball" package/package.json | jq -r '.name')"
          packed_version="$(tar -xzO -f "$tarball" package/package.json | jq -r '.version')"
          if [ "$packed_name" != "$name" ] || [ "$packed_version" != "$version" ]; then
            echo "::error title=Tarball metadata mismatch::$expected_tarball contains $packed_name@$packed_version, expected $name@$version."
            exit 1
          fi

          printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$name" "$version" "$expected_tarball" "$tarball" "$channel" "$provenance" >> "$packages_tsv"
        done < <(jq -r '.packages[]? | @base64' "$MANIFEST")

        if [ ! -s "$packages_tsv" ]; then
          echo "::error title=Manifest empty::release manifest must contain at least one package."
          exit 1
        fi

        while IFS=$'\t' read -r name version expected_tarball tarball channel provenance; do
          args=(--tag "$channel" --access public --registry https://registry.npmjs.org)
          [ "$provenance" = "true" ] && args+=(--provenance)

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: npm publish ./$expected_tarball ${args[*]} --dry-run"
            status="dry-run"
          elif npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping npm publish."
            status="already-published"
          else
            dir="$(dirname "$tarball")"
            file="$(basename "$tarball")"
            echo "Publishing $name@$version from $tarball"
            (cd "$dir" && npm publish "./$file" "${args[@]}") || {
              echo "::error title=npm publish failed::Trusted publishing must list this repo, workflow, and environment."
              exit 1
            }
            status="published"
          fi

          printf '%s\t%s\t%s\t%s\n' "$name" "$version" "$status" "$tarball" >> "$REPORT"
        done < "$packages_tsv"

    - name: Post publish summary
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        REPORT: ${{ runner.temp }}/sdk-actions-publish-npm-tarballs.tsv
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail

        count="$(jq '.packages | length' "$MANIFEST")"
        if [ "$DRY_RUN" = "true" ]; then
          echo "## npm tarball publish dry run" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "## npm tarballs published" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "**Packages:** $count" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Package | npm |" >> "$GITHUB_STEP_SUMMARY"
        echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"

        while IFS=$'\t' read -r name version status tarball; do
          npm_name="$(jq -rn --arg v "$name" '$v|@uri')"
          npm_url="https://www.npmjs.com/package/$npm_name/v/$version"
          echo "| \`$name@$version\` | [$status]($npm_url) |" >> "$GITHUB_STEP_SUMMARY"
        done < "$REPORT"

    - name: Build published Slack message
      id: message-published
      shell: bash
      env:
        REPORT: ${{ runner.temp }}/sdk-actions-publish-npm-tarballs.tsv
        SLACK_MENTION: ${{ inputs.slack_mention }}
        DRY_RUN: ${{ inputs.dry_run }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        if [ "$DRY_RUN" = "true" ]; then
          text="*npm tarball publish dry run*"
        else
          text="*npm tarballs published*"
        fi
        while IFS=$'\t' read -r name version status tarball; do
          npm_name="$(jq -rn --arg v "$name" '$v|@uri')"
          npm_url="https://www.npmjs.com/package/$npm_name/v/$version"
          text="$text\n• <$npm_url|$name@$version> - $status"
        done < "$REPORT"
        text="$text\n<$RUN_URL|View run>"
        if [ -n "$SLACK_MENTION" ]; then
          text="$text\n$SLACK_MENTION"
        fi
        {
          echo 'text<<SLACK_DELIMITER'
          printf '%b\n' "$text"
          echo 'SLACK_DELIMITER'
        } >> "$GITHUB_OUTPUT"

    - name: Send Slack message
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack_token }}
        SLACK_CHANNEL: ${{ inputs.slack_channel }}
        TEXT: ${{ steps.message-published.outputs.text }}
        FAIL_ON_ERROR: 'false'
      run: |
        # Self-guard: no-op when Slack isn't configured, so callers needn't gate this step.
        if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
          echo "Slack not configured; skipping notification."
          exit 0
        fi
        # jq --arg passes strings literally, so \n must be real newlines before encoding
        TEXT=$(printf '%b' "$TEXT")
        RESPONSE=$(curl -s --max-time 10 -X POST "https://slack.com/api/chat.postMessage" \
          -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
          -H "Content-Type: application/json; charset=utf-8" \
          -d "$(jq -n --arg channel "$SLACK_CHANNEL" --arg text "$TEXT" \
            '{channel: $channel, text: $text}')") || true
        if echo "$RESPONSE" | jq -e '.ok' > /dev/null 2>&1; then
          echo "Slack notification sent."
        elif [ "$FAIL_ON_ERROR" = "true" ]; then
          echo "::error title=Slack notification failed::$RESPONSE"
          exit 1
        else
          echo "::warning::Slack notification failed: $RESPONSE"
        fi

    - name: Build failure Slack message
      id: message-failed
      if: ${{ failure() }}
      shell: bash
      env:
        FAILURE_SLACK_MENTION: ${{ inputs.failure_slack_mention }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        text="*npm tarball publish failed*\n<$RUN_URL|View run>"
        if [ -n "$FAILURE_SLACK_MENTION" ]; then
          text="$text\n$FAILURE_SLACK_MENTION"
        fi
        {
          echo 'text<<SLACK_DELIMITER'
          printf '%b\n' "$text"
          echo 'SLACK_DELIMITER'
        } >> "$GITHUB_OUTPUT"

    - name: Send Slack message
      if: ${{ failure() }}
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack_token }}
        SLACK_CHANNEL: ${{ inputs.slack_channel }}
        TEXT: ${{ steps.message-failed.outputs.text }}
        FAIL_ON_ERROR: 'false'
      run: |
        # Self-guard: no-op when Slack isn't configured, so callers needn't gate this step.
        if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
          echo "Slack not configured; skipping notification."
          exit 0
        fi
        # jq --arg passes strings literally, so \n must be real newlines before encoding
        TEXT=$(printf '%b' "$TEXT")
        RESPONSE=$(curl -s --max-time 10 -X POST "https://slack.com/api/chat.postMessage" \
          -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
          -H "Content-Type: application/json; charset=utf-8" \
          -d "$(jq -n --arg channel "$SLACK_CHANNEL" --arg text "$TEXT" \
            '{channel: $channel, text: $text}')") || true
        if echo "$RESPONSE" | jq -e '.ok' > /dev/null 2>&1; then
          echo "Slack notification sent."
        elif [ "$FAIL_ON_ERROR" = "true" ]; then
          echo "::error title=Slack notification failed::$RESPONSE"
          exit 1
        else
          echo "::warning::Slack notification failed: $RESPONSE"
        fi
