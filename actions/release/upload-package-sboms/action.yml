# GENERATED by scripts/generate.rb — edit templates/, not this file.
# sdk-actions: {"family":"release","version":"1.0.0"}
name: Upload Package SBOMs to GitHub Releases
description: >
  Attach package SBOM assets to package GitHub releases from a release manifest. This
  is useful for monorepos that create one release per package and produce several
  prebuilt package SBOMs in a separate build job. Missing SBOMs produce warnings and
  do not fail the release.

# Manifest contract:
# {
#   "packages": [
#     {
#       "name": "@scope/package",
#       "version": "1.2.3",
#       "tag": "@scope/package@1.2.3",
#       "sbom_asset": "scope-package-1.2.3.sbom.json"
#     }
#   ]
# }
#
# Required: name, version.
# Optional: tag defaults to <name>@<version>.
# Optional: sbom_asset defaults to a basename derived from name and version: leading
# @ is removed, / becomes -, then -<version>.sbom.json is appended.
# For each package, files from the sboms glob are matched by that exact basename and
# uploaded to the GitHub release identified by tag. Missing matches only warn.

inputs:
  manifest:
    description: "Path to the release manifest described above"
    required: true
  sboms:
    description: "Space-separated SBOM paths or globs to upload"
    required: true
  repo:
    description: "GitHub owner/repo containing the releases"
    required: false
    default: '${{ github.repository }}'
  clobber:
    description: "Overwrite an existing release asset with the same name"
    required: false
    default: 'true'
  dry_run:
    description: "Print uploads without modifying GitHub releases"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Upload package SBOMs to GitHub releases
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MANIFEST: ${{ inputs.manifest }}
        SBOMS: ${{ inputs.sboms }}
        REPO: ${{ inputs.repo }}
        CLOBBER: ${{ inputs.clobber }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail

        if ! command -v jq >/dev/null 2>&1; then
          echo "::error title=jq not found::upload-package-sboms requires jq to read the release manifest."
          exit 1
        fi

        if [ "$DRY_RUN" != "true" ] && ! command -v gh >/dev/null 2>&1; then
          echo "::error title=GitHub CLI not found::upload-package-sboms requires gh to upload release assets."
          exit 1
        fi

        if [ ! -f "$MANIFEST" ]; then
          echo "::error title=Manifest not found::release manifest does not exist: $MANIFEST"
          exit 1
        fi

        shopt -s nullglob
        files=( $SBOMS )
        if [ "${#files[@]}" -eq 0 ]; then
          echo "::warning title=No SBOMs found::no files matched '$SBOMS'."
          exit 0
        fi

        clobber_args=()
        if [ "$CLOBBER" = "true" ]; then
          clobber_args+=(--clobber)
        fi

        while IFS=$'\t' read -r name version tag sbom_asset; do
          artifact_base="${name#@}"
          artifact_base="${artifact_base//\//-}"
          artifact_base="${artifact_base//@/-}"
          expected="${sbom_asset:-$artifact_base-$version.sbom.json}"
          matched=()

          for file in "${files[@]}"; do
            if [ "$(basename "$file")" = "$expected" ]; then
              matched+=("$file")
            fi
          done

          if [ "${#matched[@]}" -eq 0 ]; then
            echo "::warning title=Package SBOM missing::no SBOM named $expected found for $name@$version."
            continue
          fi

          for file in "${matched[@]}"; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN: would upload $file to $tag in $REPO"
            else
              gh release upload "$tag" "$file" --repo "$REPO" "${clobber_args[@]}"
              echo "Uploaded $(basename "$file") to $tag"
            fi
          done
        done < <(
          jq -r '.packages[]? | [.name, .version, (.tag // "\(.name)@\(.version)"), (.sbom_asset // .sbom // "")] | @tsv' "$MANIFEST"
        )
