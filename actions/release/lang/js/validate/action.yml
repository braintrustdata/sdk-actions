# GENERATED by scripts/generate.rb — edit templates/, not this file.
# sdk-actions: {"family":"release","version":"1.0.0"}
name: Validate JavaScript Release
description: >
  Judges a JavaScript release against the facts `configure` derived — the toggleable
  checks (tag unused, version unpublished, channel allowed, notes present, release
  branch) — and runs a pre-gate build + CycloneDX SBOM generation so build/SBOM-tooling
  failures (e.g. pnpm < 11.8) surface BEFORE the approval gate. Read-only: nothing is
  signed or published here. Every check is a boolean toggle (default on) with an escape
  hatch. Consumes `configure`'s `already_published` fact (does not query the registry
  itself — that fact is produced once, in configure).

inputs:
  sha:
    description: "Commit SHA being released"
    required: true
  dry_run:
    description: "Warn instead of failing on an already-existing tag / already-published version"
    required: false
    default: 'false'
  working_directory:
    description: "Path to the package root (where package.json lives)"
    required: false
    default: '.'
  node_version:
    description: >
      Node version (e.g. 24), or a path to a version file
      (.tool-versions, .nvmrc, .node-version) relative to the repo root.
    required: true
  pnpm_version:
    description: "pnpm version to install. When empty, read from package.json packageManager."
    required: false
    default: ''
  release_tag:
    description: "The release tag (from configure) — checked for prior existence"
    required: true
  channel:
    description: "The npm channel/dist-tag (from configure) — checked against allowed_channels"
    required: false
    default: 'latest'
  allowed_channels:
    description: "Comma-separated allowlist of accepted release channels"
    required: false
    default: 'latest'
  on_release_branch:
    description: "Whether the SHA is on an allowed release branch (from configure)"
    required: false
    default: 'true'
  notes:
    description: "Base64-encoded release notes (from configure) — checked non-blank"
    required: false
    default: ''
  already_published:
    description: "Whether the version is already on the registry (from configure). Judged by check_version_unpublished."
    required: false
    default: ''
  build:
    description: >
      Whether to run the build step. Set to 'false' for packages that publish their
      sources directly (no build) — the build step then no-ops.
    required: false
    default: 'true'
  build_command:
    description: "npm script to run for the build (when build is 'true')"
    required: false
    default: 'build'
  sbom:
    description: >
      Generate a CycloneDX SBOM as a pre-gate check (same generator as build-and-ship),
      so SBOM-tooling failures surface BEFORE the approval gate. Not signed or attached
      here — that happens in build-and-ship.
    required: false
    default: 'true'
  check_tag_unused:
    description: "Fail if the release tag already exists"
    required: false
    default: 'true'
  check_version_unpublished:
    description: "Fail if the version is already published to the registry (judges configure's already_published)"
    required: false
    default: 'true'
  check_channel_allowed:
    description: "Fail if channel is not in allowed_channels"
    required: false
    default: 'true'
  check_notes_not_blank:
    description: "Warn if release notes are blank"
    required: false
    default: 'true'
  enforce_release_branch:
    description: "Hard-fail (instead of warn) when the SHA is off the release branch"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ inputs.sha }}
        fetch-depth: 0

    - name: Set up pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      with:
        # Empty version → action-setup reads the pnpm version from this package.json's
        # "packageManager" field (one source of truth). A non-empty value overrides it.
        version: ${{ inputs.pnpm_version }}
        package_json_file: ${{ inputs.working_directory }}/package.json

    - name: Resolve Node version source
      id: node-src
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node_version }}
      run: |
        # node_version is either an explicit version (e.g. 24) or a path to a version
        # file (.tool-versions / .nvmrc / .node-version). Route by file existence so a
        # single input covers both; paths are relative to the repo root (as setup-node expects).
        if [ -n "$NODE_VERSION" ] && [ -f "$NODE_VERSION" ]; then
          echo "file=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "spec=" >> "$GITHUB_OUTPUT"
        else
          echo "file=" >> "$GITHUB_OUTPUT"
          echo "spec=$NODE_VERSION" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ steps.node-src.outputs.spec }}
        node-version-file: ${{ steps.node-src.outputs.file }}
        registry-url: ${{ inputs.registry }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.working_directory }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        pnpm install --frozen-lockfile || {
          echo "::error title=Dependency install failed::'pnpm install --frozen-lockfile' failed — the lockfile is likely out of sync with package.json (run 'pnpm install' and commit pnpm-lock.yaml)."
          exit 1
        }

    - name: Validate release channel
      if: ${{ inputs.check_channel_allowed == 'true' }}
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        ALLOWED: ${{ inputs.allowed_channels }}
      run: |
        IFS=',' read -ra OK <<< "$ALLOWED"
        for c in "${OK[@]}"; do
          [ "$(echo "$c" | xargs)" = "$CHANNEL" ] && exit 0
        done
        echo "::error title=Release channel not allowed::release channel '$CHANNEL' is not in the allowed set: $ALLOWED"
        exit 1

    - name: Check release
      shell: bash
      env:
        TAG: ${{ inputs.release_tag }}
        DRY_RUN: ${{ inputs.dry_run }}
        ON_RELEASE_BRANCH: ${{ inputs.on_release_branch }}
        NOTES_B64: ${{ inputs.notes }}
        CHECK_TAG_UNUSED: ${{ inputs.check_tag_unused }}
        CHECK_NOTES: ${{ inputs.check_notes_not_blank }}
        ENFORCE_RELEASE_BRANCH: ${{ inputs.enforce_release_branch }}
        CHECK_VERSION_UNPUBLISHED: ${{ inputs.check_version_unpublished }}
        ALREADY_PUBLISHED: ${{ inputs.already_published }}
      run: |
        # Version not already published on the registry (fact from configure's availability check;
        # covers prereleases, which aren't git-tagged). Warn (not fail) on a dry run.
        if [ "$CHECK_VERSION_UNPUBLISHED" = "true" ] && [ "$ALREADY_PUBLISHED" = "true" ]; then
          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning title=Version already published::the version is already on the registry — skipping in dry run."
          else
            echo "::error title=Version already published::the version is already on the registry — has the version been bumped?"
            exit 1
          fi
        fi

        # Tag not already used (covers stable releases; prereleases are covered by the availability check)
        if [ "$CHECK_TAG_UNUSED" = "true" ] && git rev-parse "$TAG" >/dev/null 2>&1; then
          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning title=Release tag already exists::Tag $TAG already exists — skipping in dry run."
          else
            echo "::error title=Release tag already exists::Tag $TAG already exists — has the version been bumped?"
            exit 1
          fi
        fi

        # On a release branch: warn by default, hard-fail only when enforced.
        if [ "$ON_RELEASE_BRANCH" = "false" ]; then
          if [ "$ENFORCE_RELEASE_BRANCH" = "true" ]; then
            echo "::error title=Off release branch::the release SHA is not on an allowed release branch (enforce_release_branch=true)."
            exit 1
          else
            echo "::warning title=Off release branch::the release SHA is not on an allowed release branch — releasing anyway."
          fi
        fi

        # Release notes present (warn only — a genuine first release, or no PRs since the last tag, is legitimate).
        if [ "$CHECK_NOTES" = "true" ]; then
          NOTES=$(echo "$NOTES_B64" | base64 -d 2>/dev/null || echo "")
          if [ -z "$NOTES" ]; then
            echo "::warning title=Empty release notes::no release notes were generated (first release, or no PRs since the last tag?)."
          fi
        fi

    - name: Build
      if: ${{ inputs.build == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        BUILD_COMMAND: ${{ inputs.build_command }}
      run: |
        pnpm run "$BUILD_COMMAND"

    - name: Generate SBOM (CycloneDX)
      if: ${{ inputs.sbom == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        PNPM="${PACK_PNPM:-pnpm}"
        if ! $PNPM sbom --help >/dev/null 2>&1; then
          echo "::error title=pnpm sbom unavailable::'pnpm sbom' needs pnpm >= 11.8. Set the package's packageManager (or pnpm_version) to >= 11.8."
          exit 1
        fi
        $PNPM sbom --sbom-format cyclonedx --prod --out sbom.json
        echo "Wrote $(pwd)/sbom.json"

    - name: Dump JavaScript environment
      if: ${{ failure() }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "=== Node environment ==="
        node --version
        npm --version
        echo "=== pnpm ==="
        pnpm --version || echo "(unavailable)"
        echo "=== package.json ==="
        node -e '
          const p = require("./package.json");
          console.log(JSON.stringify({
            name: p.name,
            version: p.version,
            private: p.private || false,
            packageManager: p.packageManager,
            engines: p.engines,
            devEngines: p.devEngines,
            publishConfig: p.publishConfig,
            lifecycle: Object.fromEntries(
              ["prepublishOnly", "prepack", "prepare", "postpack"]
                .filter((k) => p.scripts && p.scripts[k])
                .map((k) => [k, p.scripts[k]]),
            ),
          }, null, 2));
        ' 2>/dev/null || echo "(package.json unavailable)"
