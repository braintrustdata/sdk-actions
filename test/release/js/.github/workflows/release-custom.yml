name: Release

# Releases @braintrust/bt-publishing-test to npm via braintrustdata/sdk-actions, custom-build shape:
# an unprivileged `pack` job builds + packs + attests the tarball (no publish creds) and
# uploads it; a gated `ship-package` job verifies the attestation and publishes THAT exact
# tarball. Dispatch after merging the commit that bumps package.json's "version".
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (stable → GitHub release; prerelease → none)"
        type: choice
        default: stable
        options: [stable, prerelease]
      channel:
        description: "npm dist-tag / channel"
        type: choice
        default: latest
        options: [latest, rc, next, beta]
      sha:
        description: "Commit SHA (of the version bump) to release"
        required: true
        type: string
      prev_release:
        description: "Release-notes anchor: a tag or SHA (empty → the previous tag)"
        type: string
        required: false
      dry_run:
        description: "Dry run: build + pack without attesting or publishing"
        type: boolean
        default: false

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.configure.outputs.version }}
      release_tag: ${{ steps.configure.outputs.release_tag }}
      prev_release: ${{ steps.configure.outputs.prev_release }}
      branch: ${{ steps.configure.outputs.branch }}
      on_release_branch: ${{ steps.configure.outputs.on_release_branch }}
      commit_message: ${{ steps.configure.outputs.commit_message }}
      channel: ${{ steps.configure.outputs.channel }}
      github_release: ${{ steps.configure.outputs.github_release }}
    steps:
      - name: Configure release
        id: configure
        uses: braintrustdata/sdk-actions/actions/release/lang/js/configure@38dcec863c910f6802c03a94ab9aeb79931a0a3a
        with:
          sha: ${{ inputs.sha }}
          working_directory: .
          release_type: ${{ inputs.release_type }}
          channel: ${{ inputs.channel }}

  prepare:
    needs: configure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write  # releases/generate-notes API
    outputs:
      pr_list: ${{ steps.prepare.outputs.pr_list }}
      notes: ${{ steps.prepare.outputs.notes }}
    steps:
      - name: Prepare release
        id: prepare
        uses: braintrustdata/sdk-actions/actions/release/prepare@38dcec863c910f6802c03a94ab9aeb79931a0a3a
        with:
          release_tag: ${{ needs.configure.outputs.release_tag }}
          sha: ${{ inputs.sha }}
          prev_release: ${{ inputs.prev_release || needs.configure.outputs.prev_release }}

  validate:
    needs: [configure, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate release
        uses: braintrustdata/sdk-actions/actions/release/lang/js/validate@38dcec863c910f6802c03a94ab9aeb79931a0a3a
        with:
          version: ${{ needs.configure.outputs.version }}
          sha: ${{ inputs.sha }}
          dry_run: ${{ inputs.dry_run }}
          working_directory: .
          node_version: .nvmrc
          package_name: '@braintrust/bt-publishing-test'
          release_tag: ${{ needs.configure.outputs.release_tag }}
          channel: ${{ needs.configure.outputs.channel }}
          allowed_channels: 'latest,rc,next,beta'
          on_release_branch: ${{ needs.configure.outputs.on_release_branch }}
          notes: ${{ needs.prepare.outputs.notes }}
          build: 'false'   # the pack job owns the build
          sbom: 'false'    # the pack job generates + attests the SBOM

  # BUILD side — unprivileged: builds + packs + attests the tarball, NO publish credentials.
  pack:
    needs: [configure, prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Pack + attest
        id: pack
        uses: braintrustdata/sdk-actions/actions/release/lang/js/pack-pnpm@38dcec863c910f6802c03a94ab9aeb79931a0a3a
        with:
          sha: ${{ inputs.sha }}
          working_directory: .
          node_version: .nvmrc
          dry_run: ${{ inputs.dry_run }}

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp "${{ steps.pack.outputs.tarball }}" artifact/
          cp ./sbom.json artifact/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: artifact/
          retention-days: 1
          if-no-files-found: error

  request-approval:
    needs: [configure, prepare, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Request release approval
        uses: braintrustdata/sdk-actions/actions/release/request-approval@38dcec863c910f6802c03a94ab9aeb79931a0a3a
        with:
          sha: ${{ inputs.sha }}
          release_tag: ${{ needs.configure.outputs.release_tag }}
          prev_release: ${{ needs.configure.outputs.prev_release }}
          branch: ${{ needs.configure.outputs.branch }}
          on_release_branch: ${{ needs.configure.outputs.on_release_branch }}
          commit_message: ${{ needs.configure.outputs.commit_message }}
          pr_list: ${{ needs.prepare.outputs.pr_list }}
          notes: ${{ needs.prepare.outputs.notes }}
          dry_run: ${{ inputs.dry_run }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: ${{ vars.SLACK_SDK_RELEASE_CHANNEL }}
          label: '@braintrust/bt-publishing-test'
          emoji: ':javascript:'

  # PUBLISH side — gated: verifies the attestation against the downloaded tarball, then publishes it.
  ship-package:
    needs: [configure, prepare, pack, request-approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.dry_run && 'publish-dry-run' || 'publish' }}
    permissions:
      contents: write
      id-token: write     # OIDC trusted publishing + provenance
      attestations: read  # gh attestation verify
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: dl

      - name: Resolve tarball
        id: art
        run: echo "tarball=$(ls dl/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Ship package
        uses: braintrustdata/sdk-actions/actions/release/lang/js/ship-package@38dcec863c910f6802c03a94ab9aeb79931a0a3a
        with:
          tarball: ${{ steps.art.outputs.tarball }}
          working_directory: dl   # holds the tarball + sbom.json
          sha: ${{ inputs.sha }}
          dry_run: ${{ inputs.dry_run }}
          release_tag: ${{ needs.configure.outputs.release_tag }}
          github_release: ${{ needs.configure.outputs.github_release }}
          version: ${{ needs.configure.outputs.version }}
          access: 'public'
          provenance: 'true'
          channel: ${{ needs.configure.outputs.channel }}
          package_name: '@braintrust/bt-publishing-test'
          label: '@braintrust/bt-publishing-test'
          notes: ${{ needs.prepare.outputs.notes }}
          prev_release: ${{ needs.configure.outputs.prev_release }}
          branch: ${{ needs.configure.outputs.branch }}
          on_release_branch: ${{ needs.configure.outputs.on_release_branch }}
          pr_list: ${{ needs.prepare.outputs.pr_list }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: ${{ vars.SLACK_SDK_RELEASE_CHANNEL }}
          emoji: ':javascript:'
