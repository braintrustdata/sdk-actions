# GENERATED by scripts/generate.rb — edit templates/, not this file.
# sdk-actions: {"family":"release","version":"1.0.0"}
name: Pack JavaScript Package (custom build, bun)
description: >
  Build side of the custom-build ("build-ownership") path for a Bun project — runs in an
  UNPRIVILEGED job with NO publish credentials. Sets up Bun, runs `bun build --metafile`
  (bundling deps into the artifact), packs the npm tarball (`bun pm pack`), generates a
  CycloneDX SBOM FROM the build metafile (so it matches the bundled artifact), and attests
  the SBOM + SLSA build provenance to that tarball. The workflow uploads the tarball + SBOM
  for the gated ship-package job (shared with pnpm). Requires id-token: write +
  attestations: write. pnpm projects use pack-pnpm instead.

inputs:
  sha:
    description: "Commit SHA to check out and pack"
    required: true
  checkout:
    description: "Check out the SHA before building. Set to false when the caller already checked out."
    required: false
    default: 'true'
  working_directory:
    description: "Path to the package root (where package.json lives)"
    required: false
    default: '.'
  bun_version:
    description: "Bun version. Empty → auto-detect from the project (.tool-versions / package.json) or latest."
    required: false
    default: ''
  entry:
    description: "bun build entrypoint"
    required: false
    default: 'src/index.ts'
  outdir:
    description: "bun build output directory"
    required: false
    default: 'dist'
  target:
    description: "bun build --target (bun|node|browser)"
    required: false
    default: 'bun'
  format:
    description: "bun build --format (esm|cjs|iife)"
    required: false
    default: 'esm'
  sbom:
    description: "Generate + attest a CycloneDX SBOM (from the build metafile). Requires attestations: write."
    required: false
    default: 'true'
  dry_run:
    description: "Skip attestation (nothing is uploaded to the transparency log on a dry run)"
    required: false
    default: 'false'
outputs:
  tarball:
    description: "Absolute path to the packed tarball (the exact bytes ship-package will publish)"
    value: ${{ steps.pack.outputs.tarball }}
  integrity:
    description: "sha512 integrity of the packed tarball"
    value: ${{ steps.pack.outputs.integrity }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      if: ${{ inputs.checkout == 'true' }}
      with:
        ref: ${{ inputs.sha }}
        fetch-depth: 0

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun_version }}
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        bun install --frozen-lockfile || {
          echo "::error title=Dependency install failed::'bun install --frozen-lockfile' failed — the lockfile is likely out of sync with package.json (run 'bun install' and commit bun.lock)."
          exit 1
        }

    - name: Build (bun)
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        ENTRY: ${{ inputs.entry }}
        OUTDIR: ${{ inputs.outdir }}
        TARGET: ${{ inputs.target }}
        FORMAT: ${{ inputs.format }}
        METAFILE: meta.json
      run: |
        bun build "$ENTRY" --outdir "$OUTDIR" --target "$TARGET" --format "$FORMAT" --metafile="$METAFILE"
        echo "Built $OUTDIR (metafile: $METAFILE)"

    - name: Pack (bun pm pack)
      id: pack
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        PACK_DIR: ${{ runner.temp }}/pkgout
      run: |
        rm -rf "$PACK_DIR"; mkdir -p "$PACK_DIR"
        bun pm pack --destination "$PACK_DIR" >/dev/null
        TGZ=$(ls "$PACK_DIR"/*.tgz)
        echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"
        echo "integrity=sha512-$(openssl dgst -sha512 -binary "$TGZ" | openssl base64 -A)" >> "$GITHUB_OUTPUT"
        echo "Packed $TGZ"

    - name: Validate packed tarball
      shell: bash
      env:
        TGZ: ${{ steps.pack.outputs.tarball }}
      run: |
        if [ ! -f "$TGZ" ]; then
          echo "::error title=Package not found::packed tarball does not exist: $TGZ"; exit 1
        fi
        PKGJSON=$(tar -xzO -f "$TGZ" package/package.json)
        NAME=$(printf '%s' "$PKGJSON" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).name || ""')
        VER=$(printf '%s' "$PKGJSON" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version || ""')
        # Count shipped files EXCLUDING package.json — a tarball with only package.json means
        # "files"/.npmignore excluded everything that should ship.
        CONTENT=$(tar -tzf "$TGZ" | grep '^package/' | grep -vc '^package/package.json$' || true)

        if [ -z "$NAME" ]; then
          echo "::error title=Invalid package::the packed tarball has no name."; exit 1
        fi
        if [ -z "$VER" ]; then
          echo "::error title=Invalid package::the packed tarball has no version."; exit 1
        fi
        if [ "$CONTENT" -lt 1 ]; then
          echo "::error title=Empty package::the tarball ships only package.json — check the package's \"files\"/.npmignore."; exit 1
        fi
        echo "✓ $NAME@$VER — $CONTENT shipped file(s), tarball looks sane"

    - name: Generate SBOM (CycloneDX, from Bun bundle metafile)
      if: ${{ inputs.sbom == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        METAFILE: meta.json
        OUTPUT: sbom.json
      run: |
        # .cjs so it runs as CommonJS even when the package is "type": "module".
        cat > "$RUNNER_TEMP/bun-sbom.cjs" <<'CJS'
        const fs = require("fs"), crypto = require("crypto");
        const meta = JSON.parse(fs.readFileSync(process.env.METAFILE, "utf8"));
        const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
        // Collect every node_modules module the bundle actually included. The last
        // node_modules segment is the installed package (handles nesting + @scope/name).
        const seen = new Map();
        for (const out of Object.values(meta.outputs || {})) {
          for (const input of Object.keys(out.inputs || {})) {
            const m = input.match(/^(.*node_modules\/(?:@[^/]+\/[^/]+|[^/]+))\//);
            if (!m || seen.has(m[1])) continue;
            try {
              const pj = JSON.parse(fs.readFileSync(m[1] + "/package.json", "utf8"));
              if (pj.name && pj.version) seen.set(m[1], { name: pj.name, version: pj.version });
            } catch { /* not a package root; skip */ }
          }
        }
        const purl = (n, v) => `pkg:npm/${n[0] === "@" ? "%40" + n.slice(1) : n}@${v}`;
        const components = [...seen.values()]
          .sort((a, b) => a.name.localeCompare(b.name))
          .map((c) => ({ type: "library", name: c.name, version: c.version, purl: purl(c.name, c.version) }));
        const bom = {
          bomFormat: "CycloneDX",
          specVersion: "1.7",
          // Required: actions/attest recognizes CycloneDX only with bomFormat + specVersion + serialNumber.
          serialNumber: `urn:uuid:${crypto.randomUUID()}`,
          version: 1,
          metadata: {
            tools: { components: [{ type: "application", group: "braintrust", name: "sdk-actions bun sbom" }] },
            component: { type: "application", name: root.name, version: root.version, purl: purl(root.name, root.version) },
          },
          components,
        };
        fs.writeFileSync(process.env.OUTPUT, JSON.stringify(bom, null, 2));
        console.log(`Wrote ${process.env.OUTPUT}: ${components.length} bundled component(s)`);
        CJS
        node "$RUNNER_TEMP/bun-sbom.cjs"

    - name: Attest SBOM
      if: ${{ inputs.sbom == 'true' && inputs.dry_run != 'true' }}
      uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
      with:
        subject-path: |-
          ${{ steps.pack.outputs.tarball }}
        sbom-path: ${{ inputs.working_directory }}/sbom.json

    - name: Attest build provenance
      if: ${{ inputs.dry_run != 'true' }}
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-path: |-
          ${{ steps.pack.outputs.tarball }}

    - name: Dump JavaScript environment
      if: ${{ failure() }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "=== Node environment ==="
        node --version
        npm --version
        echo "=== pnpm ==="
        pnpm --version || echo "(unavailable)"
        echo "=== package.json ==="
        node -e '
          const p = require("./package.json");
          console.log(JSON.stringify({
            name: p.name,
            version: p.version,
            private: p.private || false,
            packageManager: p.packageManager,
            engines: p.engines,
            devEngines: p.devEngines,
            publishConfig: p.publishConfig,
            lifecycle: Object.fromEntries(
              ["prepublishOnly", "prepack", "prepare", "postpack"]
                .filter((k) => p.scripts && p.scripts[k])
                .map((k) => [k, p.scripts[k]]),
            ),
          }, null, 2));
        ' 2>/dev/null || echo "(package.json unavailable)"
