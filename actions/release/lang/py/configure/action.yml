# GENERATED by scripts/generate.rb — edit templates/, not this file.
name: Configure Python Release
description: >
  Derives release facts for a Python package — read-only, no token. Checks out the
  SHA, sets up uv (with a default Python the action guarantees itself — no
  python_version input) to read the version, and computes the release tag, the branch
  (and whether it's a release branch), the commit message, the previous release tag,
  and the github_release default from release_type. Its outputs feed validate,
  request-approval, and build-and-ship. Judging/checks live in the validate action;
  this action never fails on release state.

inputs:
  sha:
    description: "Commit SHA being released"
    required: true
  version:
    description: >
      Explicit version override. If provided, the version is not read from version_file.
      Use when the version is computed externally (e.g. a run-number auto-bump).
    required: false
    default: ''
  version_file:
    description: >
      Path (repo-root-relative) to a Python module exposing VERSION (e.g.
      py/pkg/version.py). Read when version is not overridden.
    required: false
    default: ''
  working_directory:
    description: "Path to the package root (where pyproject.toml lives)"
    required: false
    default: '.'
  tag_format:
    description: "Git tag format, with a {version} placeholder (e.g. py-{version})"
    required: false
    default: 'py-{version}'
  release_type:
    description: >
      'stable' | 'prerelease'. Maps to the github_release default (prerelease → no
      GitHub release). An explicit github_release input overrides this.
    required: false
    default: 'stable'
  github_release:
    description: "Explicit github_release override ('true'/'false'). Empty → derived from release_type."
    required: false
    default: ''
  release_branch:
    description: "Comma-separated allowed release branch patterns (globs)."
    required: false
    default: 'main'
outputs:
  version:
    description: "The resolved package version"
    value: ${{ steps.read-version.outputs.version }}
  release_tag:
    description: "The release tag (e.g. py-0.3.2)"
    value: ${{ steps.configure.outputs.release_tag }}
  prev_release:
    description: "The previous release tag"
    value: ${{ steps.configure.outputs.prev_release }}
  branch:
    description: "The branch containing the SHA"
    value: ${{ steps.configure.outputs.branch }}
  on_release_branch:
    description: "Whether the SHA is on an allowed release branch"
    value: ${{ steps.configure.outputs.on_release_branch }}
  commit_message:
    description: "The commit message at the SHA"
    value: ${{ steps.configure.outputs.commit_message }}
  github_release:
    description: "Whether a GitHub release should be created"
    value: ${{ steps.configure.outputs.github_release }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ inputs.sha }}
        fetch-depth: 0

    # configure reads the version (version.py) — so it sets up uv with a default Python
    # itself. The requirement is guaranteed by the action (no python_version input); any
    # Python reads the version, and the project's pinned toolchain is only needed to
    # BUILD (validate / build-and-ship). Read-only: no dependency install.
    - name: Set up uv
      uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7.2.0
      with:
        python-version: '3.13'

    - name: Read version
      id: read-version
      shell: bash
      env:
        VERSION_OVERRIDE: ${{ inputs.version }}
        VERSION_FILE: ${{ inputs.version_file }}
      run: |
        if [ -n "$VERSION_OVERRIDE" ]; then
          VERSION="$VERSION_OVERRIDE"
        else
          # exec the version file in an isolated namespace (no package import needed),
          # matching how the SDKs expose VERSION in a standalone version.py.
          VERSION=$(uv run --no-project python -c "import runpy,sys; print(runpy.run_path(sys.argv[1])['VERSION'])" "$VERSION_FILE")
        fi
        if [ -z "$VERSION" ] || [ "$VERSION" = "None" ]; then
          echo "::error title=Could not read version::resolved an empty version — check VERSION in $VERSION_FILE (or pass a version override)."
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Validate SHA format
      shell: bash
      env:
        SHA: ${{ inputs.sha }}
      run: |
        if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
          echo "::error title=Invalid release SHA::sha must be a full 40-character commit SHA — branch names and short SHAs are not accepted."
          exit 1
        fi

    - name: Configure release
      id: configure
      shell: bash
      env:
        VERSION: ${{ steps.read-version.outputs.version }}
        TAG_FORMAT: ${{ inputs.tag_format }}
        RELEASE_BRANCH: ${{ inputs.release_branch }}
        RELEASE_TYPE: ${{ inputs.release_type }}
        # Quoted: these overrides are legitimately empty (e.g. py/ruby have no channel), and an
        # unquoted empty value would parse as YAML null, which the action schema rejects.
        CHANNEL_OVERRIDE: ""
        GHR_OVERRIDE: "${{ inputs.github_release }}"
      run: |
        TAG="${TAG_FORMAT//\{version\}/$VERSION}"
        COMMIT_MSG=$(git log -1 --format="%s" HEAD)
        BRANCH=$(git branch -r --contains HEAD --format="%(refname:short)" | sed 's|origin/||' | head -1)

        ON_RELEASE_BRANCH=false
        IFS=',' read -ra PATTERNS <<< "$RELEASE_BRANCH"
        for pattern in "${PATTERNS[@]}"; do
          pattern=$(echo "$pattern" | xargs)
          if [[ "$BRANCH" == $pattern ]]; then ON_RELEASE_BRANCH=true; break; fi
        done

        PREV_RELEASE_PATTERN="${TAG_FORMAT//\{version\}/[0-9]*.[0-9]*.[0-9]*}"
        PREV_RELEASE=$(git describe --tags --abbrev=0 --match="$PREV_RELEASE_PATTERN" HEAD^ 2>/dev/null || echo "")

        # channel: explicit override wins; else map from release_type (prerelease→rc, stable→latest)
        if [ -n "$CHANNEL_OVERRIDE" ]; then CHANNEL="$CHANNEL_OVERRIDE"
        elif [ "$RELEASE_TYPE" = "prerelease" ]; then CHANNEL="rc"
        else CHANNEL="latest"; fi

        # github_release: explicit override wins; else prerelease→false, stable→true
        if [ -n "$GHR_OVERRIDE" ]; then GHR="$GHR_OVERRIDE"
        elif [ "$RELEASE_TYPE" = "prerelease" ]; then GHR="false"
        else GHR="true"; fi

        {
          echo "release_tag=$TAG"
          echo "commit_message=$COMMIT_MSG"
          echo "branch=$BRANCH"
          echo "on_release_branch=$ON_RELEASE_BRANCH"
          echo "prev_release=$PREV_RELEASE"
          echo "channel=$CHANNEL"
          echo "github_release=$GHR"
        } >> "$GITHUB_OUTPUT"
        echo "Configured $TAG @ $VERSION (channel=$CHANNEL, github_release=$GHR, branch=$BRANCH, on_release_branch=$ON_RELEASE_BRANCH)"

    - name: Dump Python environment
      if: ${{ failure() }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "=== uv / Python ==="
        uv --version || echo "(uv unavailable)"
        uv run --no-project python --version || echo "(python unavailable)"
        echo "=== UV_PYTHON ==="
        echo "${UV_PYTHON:-(unset)}"
        echo "=== Built artifacts ==="
        ls -la dist 2>/dev/null || echo "(no dist/)"
        echo "=== pyproject.toml (release-relevant) ==="
        uv run --no-project python -c '
        import json, tomllib, pathlib
        t = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
        proj = t.get("project", {})
        print(json.dumps({
            "name": proj.get("name"),
            "version": proj.get("version") or ("(dynamic)" if "version" in proj.get("dynamic", []) else None),
            "requires-python": proj.get("requires-python"),
            "dependencies": proj.get("dependencies"),
            "optional-dependencies": sorted((proj.get("optional-dependencies") or {}).keys()),
            "build-system": t.get("build-system"),
        }, indent=2))
        ' 2>/dev/null || echo "(pyproject.toml unavailable)"
