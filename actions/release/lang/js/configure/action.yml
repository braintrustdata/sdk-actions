# GENERATED by scripts/generate.rb — edit templates/, not this file.
# sdk-actions: {"family":"release","version":"1.0.0"}
name: Configure JavaScript Release
description: >
  Derives release facts for a JavaScript package — read-only, no token. Checks out the
  SHA, sets up Node and pnpm, reads the package version, and computes the release tag,
  the branch (and whether it's a release branch), the commit message, the previous
  release tag, and the channel + github_release defaults from release_type (explicit
  overrides win). Its outputs feed validate, request-approval, and build-and-ship.
  Judging/checks live in the validate action; this action never fails on release state.

inputs:
  sha:
    description: "Commit SHA being released"
    required: true
  version:
    description: >
      Explicit version override. If provided, the version is not read from package.json.
      Use when the version is computed externally (e.g. a run-number auto-bump).
    required: false
    default: ''
  working_directory:
    description: "Path to the package root (where package.json lives)"
    required: false
    default: '.'
  tag_format:
    description: "Git tag format, with a {version} placeholder (e.g. js-{version})"
    required: false
    default: 'v{version}'
  release_type:
    description: >
      'stable' | 'prerelease'. Maps to the channel + github_release defaults
      (prerelease → channel 'rc', no GitHub release). Explicit channel/github_release
      inputs override this.
    required: false
    default: 'stable'
  channel:
    description: "Explicit npm channel (dist-tag) override. Empty → derived from release_type."
    required: false
    default: ''
  github_release:
    description: "Explicit github_release override ('true'/'false'). Empty → derived from release_type."
    required: false
    default: ''
  release_branch:
    description: "Comma-separated allowed release branch patterns (globs)."
    required: false
    default: 'main'
outputs:
  version:
    description: "The resolved package version"
    value: ${{ steps.read-version.outputs.version }}
  release_tag:
    description: "The release tag (e.g. v0.3.2)"
    value: ${{ steps.configure.outputs.release_tag }}
  prev_release:
    description: "The previous release tag"
    value: ${{ steps.configure.outputs.prev_release }}
  branch:
    description: "The branch containing the SHA"
    value: ${{ steps.configure.outputs.branch }}
  on_release_branch:
    description: "Whether the SHA is on an allowed release branch"
    value: ${{ steps.configure.outputs.on_release_branch }}
  commit_message:
    description: "The commit message at the SHA"
    value: ${{ steps.configure.outputs.commit_message }}
  channel:
    description: "The resolved npm channel (dist-tag)"
    value: ${{ steps.configure.outputs.channel }}
  github_release:
    description: "Whether a GitHub release should be created"
    value: ${{ steps.configure.outputs.github_release }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ inputs.sha }}
        fetch-depth: 0

    # configure reads package.json — so it sets up a default Node itself. The
    # requirement is satisfied by the action (no node_version input, no consumer
    # config): any Node reads the version, and the project's pinned toolchain is only
    # needed to BUILD (validate / build-and-ship). A node-runtime read never touches
    # engines/devEngines, so this is safe in strict-pnpm repos. No pnpm, no install.
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 'lts/*'

    - name: Read version
      id: read-version
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        VERSION_OVERRIDE: ${{ inputs.version }}
      run: |
        if [ -n "$VERSION_OVERRIDE" ]; then
          VERSION="$VERSION_OVERRIDE"
        else
          VERSION=$(node -p "require('./package.json').version")
        fi
        if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
          echo "::error title=Could not read version::resolved an empty version — check the \"version\" field in package.json (or pass a version override)."
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Validate SHA format
      shell: bash
      env:
        SHA: ${{ inputs.sha }}
      run: |
        if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
          echo "::error title=Invalid release SHA::sha must be a full 40-character commit SHA — branch names and short SHAs are not accepted."
          exit 1
        fi

    - name: Configure release
      id: configure
      shell: bash
      env:
        VERSION: ${{ steps.read-version.outputs.version }}
        TAG_FORMAT: ${{ inputs.tag_format }}
        RELEASE_BRANCH: ${{ inputs.release_branch }}
        RELEASE_TYPE: ${{ inputs.release_type }}
        # Quoted: these overrides are legitimately empty (e.g. py/ruby have no channel), and an
        # unquoted empty value would parse as YAML null, which the action schema rejects.
        CHANNEL_OVERRIDE: "${{ inputs.channel }}"
        GHR_OVERRIDE: "${{ inputs.github_release }}"
      run: |
        TAG="${TAG_FORMAT//\{version\}/$VERSION}"
        COMMIT_MSG=$(git log -1 --format="%s" HEAD)
        BRANCH=$(git branch -r --contains HEAD --format="%(refname:short)" | sed 's|origin/||' | head -1)

        ON_RELEASE_BRANCH=false
        IFS=',' read -ra PATTERNS <<< "$RELEASE_BRANCH"
        for pattern in "${PATTERNS[@]}"; do
          pattern=$(echo "$pattern" | xargs)
          if [[ "$BRANCH" == $pattern ]]; then ON_RELEASE_BRANCH=true; break; fi
        done

        PREV_RELEASE_PATTERN="${TAG_FORMAT//\{version\}/[0-9]*.[0-9]*.[0-9]*}"
        PREV_RELEASE=$(git describe --tags --abbrev=0 --match="$PREV_RELEASE_PATTERN" HEAD^ 2>/dev/null || echo "")

        # channel: explicit override wins; else map from release_type (prerelease→rc, stable→latest)
        if [ -n "$CHANNEL_OVERRIDE" ]; then CHANNEL="$CHANNEL_OVERRIDE"
        elif [ "$RELEASE_TYPE" = "prerelease" ]; then CHANNEL="rc"
        else CHANNEL="latest"; fi

        # github_release: explicit override wins; else prerelease→false, stable→true
        if [ -n "$GHR_OVERRIDE" ]; then GHR="$GHR_OVERRIDE"
        elif [ "$RELEASE_TYPE" = "prerelease" ]; then GHR="false"
        else GHR="true"; fi

        {
          echo "release_tag=$TAG"
          echo "commit_message=$COMMIT_MSG"
          echo "branch=$BRANCH"
          echo "on_release_branch=$ON_RELEASE_BRANCH"
          echo "prev_release=$PREV_RELEASE"
          echo "channel=$CHANNEL"
          echo "github_release=$GHR"
        } >> "$GITHUB_OUTPUT"
        echo "Configured $TAG @ $VERSION (channel=$CHANNEL, github_release=$GHR, branch=$BRANCH, on_release_branch=$ON_RELEASE_BRANCH)"

    - name: Dump JavaScript environment
      if: ${{ failure() }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "=== Node environment ==="
        node --version
        npm --version
        echo "=== pnpm ==="
        pnpm --version || echo "(unavailable)"
        echo "=== package.json ==="
        node -e '
          const p = require("./package.json");
          console.log(JSON.stringify({
            name: p.name,
            version: p.version,
            private: p.private || false,
            packageManager: p.packageManager,
            engines: p.engines,
            devEngines: p.devEngines,
            publishConfig: p.publishConfig,
            lifecycle: Object.fromEntries(
              ["prepublishOnly", "prepack", "prepare", "postpack"]
                .filter((k) => p.scripts && p.scripts[k])
                .map((k) => [k, p.scripts[k]]),
            ),
          }, null, 2));
        ' 2>/dev/null || echo "(package.json unavailable)"
