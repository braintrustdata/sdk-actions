# GENERATED by scripts/generate.rb — edit templates/, not this file.
# sdk-actions: {"family":"release","version":"1.0.0"}
name: Pack Ruby Package (custom build)
description: >
  Custom-build side (unprivileged — no publish credentials): checks out the SHA, builds
  the gem, generates a CycloneDX SBOM, and attests the SBOM + SLSA build provenance to
  that exact gem. The workflow uploads pkg/*.gem + sbom.json for the gated ship-package
  job. Requires id-token: write + attestations: write.

inputs:
  sha:
    description: "Commit SHA to check out and pack"
    required: true
  checkout:
    description: "Check out the SHA before building. Set to false when the caller already checked out."
    required: false
    default: 'true'
  working_directory:
    description: "Path to the gem root (where Gemfile and gemspec live)"
    required: false
    default: '.'
  ruby_version:
    description: "Ruby version to build with, or a version file path (.tool-versions, .ruby-version)"
    required: false
    default: '4.0'
  sbom:
    description: "Generate + attest a CycloneDX SBOM bound to the gem. Requires attestations: write."
    required: false
    default: 'true'
  dry_run:
    description: "Skip attestation (nothing is uploaded to the transparency log on a dry run)"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      if: ${{ inputs.checkout == 'true' }}
      with:
        ref: ${{ inputs.sha }}
        fetch-depth: 0

    - name: Set up Ruby
      uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
      with:
        ruby-version: ${{ inputs.ruby_version }}
        bundler-cache: true
        working-directory: ${{ inputs.working_directory }}

    - name: Build gem
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        bundle exec rake build
        if [ "$(ls pkg/*.gem 2>/dev/null | wc -l)" -ne 1 ]; then
          echo "::error title=Build failed::expected exactly one gem at pkg/*.gem after 'rake build' — found: $(ls pkg/*.gem 2>/dev/null || echo none)"
          exit 1
        fi
        echo "Built $(ls pkg/*.gem)"

    - name: Generate SBOM (CycloneDX)
      if: ${{ inputs.sbom == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GEM_NAME: ${{ inputs.gem_name }}
      run: |
        if [ ! -f Gemfile.lock ]; then
          echo "::error title=SBOM failed::Gemfile.lock not found in $(pwd) — bundle install must run before SBOM generation."
          exit 1
        fi
        # Map Gemfile.lock → CycloneDX 1.7 JSON with Bundler's own lockfile parser.
        # Only the gem's RUNTIME closure is included: we walk the dependency graph
        # from the gem itself, so the dev/test toolchain (rubocop, rake, …) that lives
        # in Gemfile.lock but is not a runtime dependency of the published gem is
        # excluded. The gem is the SBOM subject (metadata.component); its runtime
        # closure are the components; the dependencies graph records subject→deps edges.
        ruby <<'RUBY'
        require 'bundler'
        require 'json'
        require 'securerandom'
        lock = Bundler::LockfileParser.new(File.read('Gemfile.lock'))
        by_name = lock.specs.each_with_object({}) { |s, h| h[s.name] = s }
        # The gem being released: prefer the explicit gem_name, else the local
        # path/gemspec source spec (the gem defined in this repo).
        root_name = ENV['GEM_NAME'].to_s.empty? ? nil : ENV['GEM_NAME']
        root = (by_name[root_name] if root_name) ||
               lock.specs.find { |s| s.source.is_a?(Bundler::Source::Path) }
        abort("::error title=SBOM failed::could not identify the gem in Gemfile.lock (set gem_name).") unless root
        # Breadth-first over each spec's runtime dependencies (as recorded per-gem in
        # the GEM section of the lockfile), starting from the released gem.
        seen = {}
        queue = root.dependencies.map(&:name)
        until queue.empty?
          name = queue.shift
          next if seen[name] || !by_name[name]
          spec = by_name[name]
          seen[name] = spec
          queue.concat(spec.dependencies.map(&:name))
        end
        ref = ->(s) { "pkg:gem/#{s.name}@#{s.version}" }
        component = ->(s, type) do
          { 'type' => type, 'name' => s.name, 'version' => s.version.to_s,
            'purl' => ref.call(s), 'bom-ref' => ref.call(s) }
        end
        # Dependency edges (NTIA dependency-relationship element): each node → its direct
        # runtime deps that are in the BOM (the subject + its closure).
        in_bom = ->(n) { n == root.name || seen.key?(n) }
        edges = ->(s) do
          { 'ref' => ref.call(s),
            'dependsOn' => s.dependencies.map(&:name).select { |n| in_bom.call(n) }.map { |n| ref.call(by_name[n]) }.uniq }
        end
        bom = {
          'bomFormat'    => 'CycloneDX',
          'specVersion'  => '1.7',
          # Required: actions/attest recognizes CycloneDX only when bomFormat + specVersion
          # + serialNumber are all present (see actions/attest src/sbom.ts). Don't remove.
          'serialNumber' => "urn:uuid:#{SecureRandom.uuid}",
          'version'      => 1,
          'metadata'     => {
            # CycloneDX ≥1.5 tools shape (the array-of-tools form was deprecated in 1.5).
            'tools'     => { 'components' => [{ 'type' => 'application', 'group' => 'braintrust', 'name' => 'sdk-actions ruby sbom' }] },
            'component' => component.call(root, 'library'),
          },
          'components'   => seen.values.sort_by(&:name).map { |s| component.call(s, 'library') },
          'dependencies' => [edges.call(root)] + seen.values.sort_by(&:name).map { |s| edges.call(s) },
        }
        File.write('sbom.json', JSON.pretty_generate(bom))
        puts "Wrote #{Dir.pwd}/sbom.json (subject: #{root.name}, #{seen.size} runtime components)"
        RUBY

    - name: Attest SBOM
      if: ${{ inputs.sbom == 'true' && inputs.dry_run != 'true' }}
      uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
      with:
        subject-path: |-
          ${{ inputs.working_directory }}/pkg/*.gem
        sbom-path: ${{ inputs.working_directory }}/sbom.json

    - name: Attest build provenance
      if: ${{ inputs.dry_run != 'true' }}
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-path: |-
          ${{ inputs.working_directory }}/pkg/*.gem

    - name: Dump Ruby environment
      if: ${{ failure() }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "=== Ruby environment ==="
        ruby --version
        bundle --version
        echo "=== Default gems (version conflicts may cause activation errors) ==="
        ruby -e "Gem::Specification.default_stubs.map { |s| \"#{s.name} #{s.version}\" }.sort.each { |g| puts g }"
        echo "=== Gemfile.lock BUNDLED WITH ==="
        grep -A1 "^BUNDLED WITH" Gemfile.lock 2>/dev/null || echo "(not found)"
