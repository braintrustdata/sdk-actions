# GENERATED by scripts/generate.rb — edit templates/, not this file.
# sdk-actions: {"family":"release","version":"1.0.0"}
name: Pack JavaScript Package (custom build, pnpm)
description: >
  Build side of the custom-build ("build-ownership") path for a pnpm project — runs in
  an UNPRIVILEGED job with NO publish credentials. Checks out the SHA, builds, packs the
  exact tarball (`pnpm pack`), generates a CycloneDX SBOM (`pnpm sbom`), and attests both
  the SBOM and SLSA build provenance to that tarball. The workflow uploads the tarball +
  SBOM for the gated ship-package job to verify and publish. This is the
  `build → pack → attest` prefix of the pipeline; ship-package is the
  `publish → release → announce` suffix. Requires id-token: write + attestations: write
  (but NOT publish credentials). Bun projects use pack-bun instead.

inputs:
  sha:
    description: "Commit SHA to check out and pack"
    required: true
  checkout:
    description: "Check out the SHA before packing. Set to false when the caller has already checked out and built."
    required: false
    default: 'true'
  working_directory:
    description: "Path to the package root (where package.json lives)"
    required: false
    default: '.'
  node_version:
    description: >
      Node version (e.g. 24), or a path to a version file
      (.tool-versions, .nvmrc, .node-version) relative to the repo root.
    required: true
  pnpm_version:
    description: "pnpm version to install. When empty, read from package.json packageManager."
    required: false
    default: ''
  build:
    description: >
      Whether to run the build step. Set to 'false' when the consumer's own build
      already ran (the common monorepo case) — pack then just packages the output.
    required: false
    default: 'true'
  build_command:
    description: "npm script to run for the build (when build is 'true')"
    required: false
    default: 'build'
  sbom:
    description: "Generate + attest a CycloneDX SBOM bound to the packed tarball. Requires attestations: write."
    required: false
    default: 'true'
  dry_run:
    description: "Skip attestation (nothing is uploaded to the transparency log on a dry run)"
    required: false
    default: 'false'
outputs:
  tarball:
    description: "Absolute path to the packed tarball (the exact bytes ship-package will publish)"
    value: ${{ steps.pack.outputs.tarball }}
  integrity:
    description: "sha512 integrity of the packed tarball"
    value: ${{ steps.pack.outputs.integrity }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      if: ${{ inputs.checkout == 'true' }}
      with:
        ref: ${{ inputs.sha }}
        fetch-depth: 0

    - name: Set up pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      with:
        # Empty version → action-setup reads the pnpm version from this package.json's
        # "packageManager" field (one source of truth). A non-empty value overrides it.
        version: ${{ inputs.pnpm_version }}
        package_json_file: ${{ inputs.working_directory }}/package.json

    - name: Resolve Node version source
      id: node-src
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node_version }}
      run: |
        # node_version is either an explicit version (e.g. 24) or a path to a version
        # file (.tool-versions / .nvmrc / .node-version). Route by file existence so a
        # single input covers both; paths are relative to the repo root (as setup-node expects).
        if [ -n "$NODE_VERSION" ] && [ -f "$NODE_VERSION" ]; then
          echo "file=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "spec=" >> "$GITHUB_OUTPUT"
        else
          echo "file=" >> "$GITHUB_OUTPUT"
          echo "spec=$NODE_VERSION" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ steps.node-src.outputs.spec }}
        node-version-file: ${{ steps.node-src.outputs.file }}
        registry-url: ${{ inputs.registry }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.working_directory }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        pnpm install --frozen-lockfile || {
          echo "::error title=Dependency install failed::'pnpm install --frozen-lockfile' failed — the lockfile is likely out of sync with package.json (run 'pnpm install' and commit pnpm-lock.yaml)."
          exit 1
        }

    - name: Build
      if: ${{ inputs.build == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        BUILD_COMMAND: ${{ inputs.build_command }}
      run: |
        pnpm run "$BUILD_COMMAND"

    - name: Resolve packaging pnpm
      # pack + sbom need pnpm >= 11.8, but install/build above use the project's own pnpm — which may
      # pin an OLDER pnpm (packageManager) to honor its supply-chain config. Resolve the packaging
      # pnpm here and export $PACK_PNPM for those two steps: the project's pnpm when it already
      # satisfies >= 11.8, else a pinned one via corepack. --pm-on-fail=ignore only bypasses pnpm's
      # packageManager version-mismatch refusal; the pack/sbom logic is the standard logic for that
      # version, so the attested tarball bytes + SBOM are exactly what a same-version job produces.
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        PINNED: '11.9.0'  # sdk-actions-tested pnpm for pack + sbom (>= 11.8); bump centrally as pnpm advances
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        CUR=$(pnpm --version 2>/dev/null || echo 0)
        if printf '11.8.0\n%s\n' "$CUR" | sort -VC; then
          echo "PACK_PNPM=pnpm" >> "$GITHUB_ENV"
          echo "Packaging with the project's pnpm $CUR (>= 11.8)"
        else
          echo "PACK_PNPM=corepack pnpm@$PINNED --pm-on-fail=ignore" >> "$GITHUB_ENV"
          echo "Project pnpm $CUR is < 11.8 — packaging with pinned pnpm $PINNED"
        fi

    - name: Pack
      id: pack
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        PACK_DIR: ${{ runner.temp }}/pkgout
      run: |
        rm -rf "$PACK_DIR"; mkdir -p "$PACK_DIR"
        ${PACK_PNPM:-pnpm} pack --pack-destination "$PACK_DIR" >/dev/null
        TGZ=$(ls "$PACK_DIR"/*.tgz)
        echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"
        echo "integrity=sha512-$(openssl dgst -sha512 -binary "$TGZ" | openssl base64 -A)" >> "$GITHUB_OUTPUT"
        echo "Packed $TGZ"

    - name: Validate packed tarball
      shell: bash
      env:
        TGZ: ${{ steps.pack.outputs.tarball }}
      run: |
        if [ ! -f "$TGZ" ]; then
          echo "::error title=Package not found::packed tarball does not exist: $TGZ"; exit 1
        fi
        PKGJSON=$(tar -xzO -f "$TGZ" package/package.json)
        NAME=$(printf '%s' "$PKGJSON" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).name || ""')
        VER=$(printf '%s' "$PKGJSON" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version || ""')
        # Count shipped files EXCLUDING package.json — a tarball with only package.json means
        # "files"/.npmignore excluded everything that should ship.
        CONTENT=$(tar -tzf "$TGZ" | grep '^package/' | grep -vc '^package/package.json$' || true)

        if [ -z "$NAME" ]; then
          echo "::error title=Invalid package::the packed tarball has no name."; exit 1
        fi
        if [ -z "$VER" ]; then
          echo "::error title=Invalid package::the packed tarball has no version."; exit 1
        fi
        if [ "$CONTENT" -lt 1 ]; then
          echo "::error title=Empty package::the tarball ships only package.json — check the package's \"files\"/.npmignore."; exit 1
        fi
        echo "✓ $NAME@$VER — $CONTENT shipped file(s), tarball looks sane"

    - name: Generate SBOM (CycloneDX)
      if: ${{ inputs.sbom == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        PNPM="${PACK_PNPM:-pnpm}"
        if ! $PNPM sbom --help >/dev/null 2>&1; then
          echo "::error title=pnpm sbom unavailable::'pnpm sbom' needs pnpm >= 11.8. Set the package's packageManager (or pnpm_version) to >= 11.8."
          exit 1
        fi
        $PNPM sbom --sbom-format cyclonedx --prod --out sbom.json
        echo "Wrote $(pwd)/sbom.json"

    - name: Attest SBOM
      if: ${{ inputs.sbom == 'true' && inputs.dry_run != 'true' }}
      uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
      with:
        subject-path: |-
          ${{ steps.pack.outputs.tarball }}
        sbom-path: ${{ inputs.working_directory }}/sbom.json

    - name: Attest build provenance
      if: ${{ inputs.dry_run != 'true' }}
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-path: |-
          ${{ steps.pack.outputs.tarball }}

    - name: Dump JavaScript environment
      if: ${{ failure() }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "=== Node environment ==="
        node --version
        npm --version
        echo "=== pnpm ==="
        pnpm --version || echo "(unavailable)"
        echo "=== package.json ==="
        node -e '
          const p = require("./package.json");
          console.log(JSON.stringify({
            name: p.name,
            version: p.version,
            private: p.private || false,
            packageManager: p.packageManager,
            engines: p.engines,
            devEngines: p.devEngines,
            publishConfig: p.publishConfig,
            lifecycle: Object.fromEntries(
              ["prepublishOnly", "prepack", "prepare", "postpack"]
                .filter((k) => p.scripts && p.scripts[k])
                .map((k) => [k, p.scripts[k]]),
            ),
          }, null, 2));
        ' 2>/dev/null || echo "(package.json unavailable)"
