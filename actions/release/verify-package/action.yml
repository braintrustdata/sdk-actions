name: Verify Release Package Attestations
description: >
  Verifies downloaded release artifact attestations against their own bytes. Use this
  in custom release workflows that publish multiple prebuilt artifacts without using a
  language-specific ship-package action.

inputs:
  artifacts:
    description: "Space-separated artifact paths or globs to verify"
    required: true
  repo:
    description: "GitHub owner/repo where the attestations live"
    required: false
    default: '${{ github.repository }}'
  dry_run:
    description: "Skip verification when artifacts were intentionally not attested"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Verify attestations
      if: ${{ inputs.dry_run != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACTS: ${{ inputs.artifacts }}
        REPO: ${{ inputs.repo }}
      run: |
        shopt -s nullglob
        FILES=( $ARTIFACTS )
        if [ ${#FILES[@]} -eq 0 ]; then
          echo "::error title=Nothing to verify::no artifact files matched '$ARTIFACTS'."
          exit 1
        fi
        for f in "${FILES[@]}"; do
          echo "Verifying $(basename "$f") — build provenance…"
          gh attestation verify "$f" --repo "$REPO" || {
            echo "::error title=Provenance verification failed::no build-provenance attestation matches $(basename "$f") — the artifact was not produced by a trusted build, or was tampered with in transit."
            exit 1
          }
          echo "Verifying $(basename "$f") — SBOM…"
          gh attestation verify "$f" --repo "$REPO" --predicate-type https://cyclonedx.org/bom || {
            echo "::error title=SBOM verification failed::no CycloneDX SBOM attestation matches $(basename "$f")."
            exit 1
          }
        done
        echo "✓ attestations verified for: ${FILES[*]}"
