#
# Reference implementation of the v2 Python CUSTOM-BUILD ("build-ownership") shape,
# using bt-publishing-test. This does NOT release a real SDK.
#
# Same pipeline as turnkey, cut at the build⟷publish seam:
#   configure → prepare → validate → pack (unprivileged build) → request-approval → [gate] → ship-package
# pack builds + attests dist/* (whl + sdist) with NO publish credentials and uploads them;
# ship-package (gated) verifies their attestations and publishes THOSE exact dists.
#
# SETUP: PyPI Trusted Publishing must list THIS workflow filename (release-py-custom.yml)
#   + the `publish` environment. Only the ship-package job publishes.

name: Release Python custom-build (bt-publishing-test)

on:
  pull_request:
    paths:
      - 'actions/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type — maps to the github_release default"
        type: choice
        default: stable
        options: [stable, prerelease]
      sha:
        description: "Commit SHA (of the version bump) to release"
        required: true
        type: string
      prev_release:
        description: "Anchor for release notes: a tag name or commit SHA."
        type: string
        required: false
        default: '58a397193105516446c3042361913655bcece509'
      dry_run:
        description: "Dry run: build + pack (no attest, no publish)"
        type: boolean
        default: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Bump version
        id: bump
        run: |
          CURRENT=$(curl -sf https://pypi.org/pypi/bt-publishing-test/json 2>/dev/null | jq -r '.info.version // empty' || true)
          CURRENT=${CURRENT:-0.0.0}
          IFS='.' read -r major minor patch <<< "$CURRENT"
          echo "version=$major.$minor.$((patch + 1))" >> $GITHUB_OUTPUT

  configure:
    needs: bump
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.configure.outputs.version }}
      release_tag: ${{ steps.configure.outputs.release_tag }}
      prev_release: ${{ steps.configure.outputs.prev_release }}
      branch: ${{ steps.configure.outputs.branch }}
      on_release_branch: ${{ steps.configure.outputs.on_release_branch }}
      commit_message: ${{ steps.configure.outputs.commit_message }}
      github_release: ${{ steps.configure.outputs.github_release }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure release
        id: configure
        uses: ./actions/release/lang/py/configure
        with:
          version: ${{ needs.bump.outputs.version }}
          sha: ${{ inputs.sha || github.event.pull_request.head.sha }}
          working_directory: test/release/py
          release_type: ${{ inputs.release_type || 'stable' }}

  prepare:
    needs: configure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      pr_list: ${{ steps.prepare.outputs.pr_list }}
      notes: ${{ steps.prepare.outputs.notes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare release
        id: prepare
        uses: ./actions/release/prepare
        with:
          release_tag: ${{ needs.configure.outputs.release_tag }}
          sha: ${{ inputs.sha || github.event.pull_request.head.sha }}
          prev_release: ${{ inputs.prev_release || github.event.pull_request.head.sha || needs.configure.outputs.prev_release }}

  validate:
    needs: [configure, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate release
        uses: ./actions/release/lang/py/validate
        with:
          version: ${{ needs.configure.outputs.version }}
          sha: ${{ inputs.sha || github.event.pull_request.head.sha }}
          dry_run: ${{ inputs.dry_run || github.event_name == 'pull_request' }}
          working_directory: test/release/py
          python_version: test/release/py/.python-version
          package_name: bt-publishing-test
          release_tag: ${{ needs.configure.outputs.release_tag }}
          on_release_branch: ${{ needs.configure.outputs.on_release_branch }}
          notes: ${{ needs.prepare.outputs.notes }}
          build: 'false'   # the pack job owns the build
          sbom: 'false'    # pack generates + attests the SBOM

  # BUILD side — unprivileged: NO publish credentials.
  pack:
    needs: [configure, prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0

      # bt-publishing-test: write the resolved version into version.py before building.
      - name: Apply version to version.py
        env:
          VERSION: ${{ needs.configure.outputs.version }}
        run: |
          printf 'VERSION = "%s"\n' "$VERSION" > test/release/py/src/bt_publishing_test/version.py

      - name: Pack + attest
        uses: ./actions/release/lang/py/pack
        with:
          sha: ${{ inputs.sha || github.event.pull_request.head.sha }}
          checkout: 'false'
          working_directory: test/release/py
          python_version: test/release/py/.python-version
          dry_run: ${{ inputs.dry_run || github.event_name == 'pull_request' }}

      # Stage the exact built dists (whl + sdist) + SBOM, preserving dist/ layout.
      - name: Stage artifact
        run: |
          mkdir -p artifact/dist
          cp test/release/py/dist/*.whl test/release/py/dist/*.tar.gz artifact/dist/
          cp test/release/py/sbom.json artifact/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: artifact/
          retention-days: 1
          if-no-files-found: error

  request-approval:
    needs: [configure, prepare, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Request release approval
        uses: ./actions/release/request-approval
        with:
          sha: ${{ inputs.sha || github.event.pull_request.head.sha }}
          release_tag: ${{ needs.configure.outputs.release_tag }}
          prev_release: ${{ needs.configure.outputs.prev_release }}
          branch: ${{ needs.configure.outputs.branch }}
          on_release_branch: ${{ needs.configure.outputs.on_release_branch }}
          commit_message: ${{ needs.configure.outputs.commit_message }}
          pr_list: ${{ needs.prepare.outputs.pr_list }}
          notes: ${{ needs.prepare.outputs.notes }}
          dry_run: ${{ inputs.dry_run || github.event_name == 'pull_request' }}
          slack_token: ${{ github.event_name != 'pull_request' && secrets.SLACK_BOT_TOKEN || '' }}
          slack_channel: ${{ github.event_name != 'pull_request' && vars.SLACK_SDK_RELEASE_CHANNEL || '' }}
          label: 'bt-publishing-test'
          emoji: ':python:'

  # PUBLISH side — gated.
  ship-package:
    needs: [configure, prepare, pack, request-approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: >-
      ${{ github.event_name != 'pull_request'
          && (inputs.dry_run && 'publish-dry-run' || 'publish')
          || '' }}
    permissions:
      contents: write
      id-token: write     # OIDC trusted publishing + PEP 740
      attestations: read  # gh attestation verify
    steps:
      # Reference workflows exercise the in-repo actions via local `./actions/...`
      # paths, so the repo must be checked out for the action files to resolve. (A
      # real consumer pins a remote `...@<sha>` ref and needs no checkout here.)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: dl

      - name: Ship package
        uses: ./actions/release/lang/py/ship-package
        with:
          working_directory: dl   # holds dist/ (whl + sdist) + sbom.json
          sha: ${{ inputs.sha || github.event.pull_request.head.sha }}
          dry_run: ${{ inputs.dry_run || github.event_name == 'pull_request' }}
          release_tag: ${{ needs.configure.outputs.release_tag }}
          # ⚠️ TEST-BED EXCEPTION — do NOT copy. Real consumers wire the derived value:
          #     github_release: ${{ needs.configure.outputs.github_release }}
          github_release: 'false'
          version: ${{ needs.configure.outputs.version }}
          package_name: bt-publishing-test
          label: 'bt-publishing-test'
          notes: ${{ needs.prepare.outputs.notes }}
          prev_release: ${{ needs.configure.outputs.prev_release }}
          branch: ${{ needs.configure.outputs.branch }}
          on_release_branch: ${{ needs.configure.outputs.on_release_branch }}
          pr_list: ${{ needs.prepare.outputs.pr_list }}
          slack_token: ${{ github.event_name != 'pull_request' && secrets.SLACK_BOT_TOKEN || '' }}
          slack_channel: ${{ github.event_name != 'pull_request' && vars.SLACK_SDK_RELEASE_CHANNEL || '' }}
          emoji: ':python:'
