# GENERATED by scripts/generate.rb — edit templates/, not this file.
# sdk-actions: {"family":"release","version":"1.0.0"}
name: Pack Python Package (custom build)
description: >
  Custom-build side (unprivileged — no publish credentials): checks out the SHA, builds
  the sdist + wheel, generates a CycloneDX SBOM, and attests the SBOM + SLSA build
  provenance to those dists. The workflow uploads dist/* + sbom.json for the gated
  ship-package job. Requires id-token: write + attestations: write.

  Note: unlike turnkey py (which relies on PyPI's native PEP 740 provenance), the custom
  path also emits our own build provenance — ship-package verifies it against the
  downloaded dists before publishing.

inputs:
  sha:
    description: "Commit SHA to check out and pack"
    required: true
  checkout:
    description: "Check out the SHA before building. Set to false when the caller already checked out."
    required: false
    default: 'true'
  working_directory:
    description: "Path to the package root (where pyproject.toml lives)"
    required: false
    default: '.'
  python_version:
    description: >
      Python version (e.g. 3.13), or a path to a version file
      (.python-version, .tool-versions) relative to the repo root.
    required: true
  build_command:
    description: "Override build command. When empty, `uv build` is used."
    required: false
    default: ''
  sbom:
    description: "Generate + attest a CycloneDX SBOM bound to the dists. Requires attestations: write."
    required: false
    default: 'true'
  dry_run:
    description: "Skip attestation (nothing is uploaded to the transparency log on a dry run)"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      if: ${{ inputs.checkout == 'true' }}
      with:
        ref: ${{ inputs.sha }}
        fetch-depth: 0

    - name: Resolve Python version source
      id: py-src
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python_version }}
      run: |
        # python_version is either an explicit version (e.g. 3.13) or a path to a
        # version file (.python-version / .tool-versions). Route by file existence.
        if [ -n "$PYTHON_VERSION" ] && [ -f "$PYTHON_VERSION" ]; then
          case "$PYTHON_VERSION" in
            *.tool-versions) SPEC=$(awk '/^python /{print $2; exit}' "$PYTHON_VERSION") ;;
            *)               SPEC=$(head -1 "$PYTHON_VERSION" | tr -d '[:space:]') ;;
          esac
        else
          SPEC="$PYTHON_VERSION"
        fi
        echo "spec=$SPEC" >> "$GITHUB_OUTPUT"

    - name: Set up uv
      uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7.2.0
      with:
        # Installs this Python and exports UV_PYTHON for the job, so subsequent uv
        # commands (build, read-version) use it.
        python-version: ${{ steps.py-src.outputs.spec }}
        # Don't fail the job when there's nothing to cache (jobs that install no deps).
        ignore-nothing-to-cache: "true"

    - name: Build distribution
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        BUILD_COMMAND: ${{ inputs.build_command }}
      run: |
        rm -rf dist
        if [ -n "$BUILD_COMMAND" ]; then
          echo "Running custom build: $BUILD_COMMAND"
          eval "$BUILD_COMMAND"
        else
          uv build
        fi
        uvx twine check dist/*

    - name: Generate SBOM (CycloneDX)
      if: ${{ inputs.sbom == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        # cyclonedx-py can't read uv lockfiles, so scan the wheel's installed closure:
        # install the built wheel into a throwaway venv, then generate from that env.
        SBOM_VENV="$(mktemp -d)/venv"
        uv venv "$SBOM_VENV"
        uv pip install --python "$SBOM_VENV/bin/python" dist/*.whl
        # NB: do NOT add --output-reproducible — it strips serialNumber (and the timestamp),
        # and actions/attest requires serialNumber to recognize the SBOM as CycloneDX.
        uvx --from "cyclonedx-bom==7.3.0" cyclonedx-py environment "$SBOM_VENV" \
          --spec-version 1.7 --output-format JSON --output-file sbom.raw.json

        # Promote the built package to the SBOM subject: the env scan leaves it in
        # `components` with no purl and a local build-path ref. Identify it (the only
        # component installed from a local file://), set it as metadata.component with a
        # pkg:pypi purl (normalized: lowercase, '_'->'-'), strip the build-path ref, and
        # drop it from components. Its bom-ref (and the dependencies-graph root) are kept.
        jq '
          def is_local: (.externalReferences // []) | any(.type == "distribution" and ((.url // "") | tostring | startswith("file:")));
          ([.components[] | select(is_local)] | .[0]) as $subj
          | if $subj == null then error("SBOM: could not identify the built package component") else . end
          | ($subj.name | ascii_downcase | gsub("_"; "-")) as $norm
          | .metadata.component = (
              $subj
              | .type = "library"
              | .purl = "pkg:pypi/\($norm)@\($subj.version)"
              | .externalReferences = [ (.externalReferences // [])[] | select(((.url // "") | tostring | startswith("file:")) | not) ]
              | if (.externalReferences | length) == 0 then del(.externalReferences) else . end )
          | .components = [ .components[] | select(.["bom-ref"] != $subj["bom-ref"]) ]
        ' sbom.raw.json > sbom.json
        rm -f sbom.raw.json
        echo "Wrote $(pwd)/sbom.json"

    - name: Attest SBOM
      if: ${{ inputs.sbom == 'true' && inputs.dry_run != 'true' }}
      uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
      with:
        subject-path: |-
          ${{ inputs.working_directory }}/dist/*.whl
          ${{ inputs.working_directory }}/dist/*.tar.gz
        sbom-path: ${{ inputs.working_directory }}/sbom.json

    - name: Attest build provenance
      if: ${{ inputs.dry_run != 'true' }}
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-path: |-
          ${{ inputs.working_directory }}/dist/*.whl
          ${{ inputs.working_directory }}/dist/*.tar.gz

    - name: Dump Python environment
      if: ${{ failure() }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "=== uv / Python ==="
        uv --version || echo "(uv unavailable)"
        uv run --no-project python --version || echo "(python unavailable)"
        echo "=== UV_PYTHON ==="
        echo "${UV_PYTHON:-(unset)}"
        echo "=== Built artifacts ==="
        ls -la dist 2>/dev/null || echo "(no dist/)"
        echo "=== pyproject.toml (release-relevant) ==="
        uv run --no-project python -c '
        import json, tomllib, pathlib
        t = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
        proj = t.get("project", {})
        print(json.dumps({
            "name": proj.get("name"),
            "version": proj.get("version") or ("(dynamic)" if "version" in proj.get("dynamic", []) else None),
            "requires-python": proj.get("requires-python"),
            "dependencies": proj.get("dependencies"),
            "optional-dependencies": sorted((proj.get("optional-dependencies") or {}).keys()),
            "build-system": t.get("build-system"),
        }, indent=2))
        ' 2>/dev/null || echo "(pyproject.toml unavailable)"
