# GENERATED by scripts/generate.rb — edit templates/, not this file.
# sdk-actions: {"family":"release","version":"1.0.0"}
name: Build Package Manifest
description: >
  Formats one package's release facts into a single, well-formed package manifest entry
  (compact JSON) via the shared release/build-manifest step. Multi-package workflows call
  this once per package (label/emoji at the call site) and splice the entries into
  request-approval's `packages`. Package-level facts (label, emoji, tag, prev_release,
  pr_list, notes, github_release) + per-registry facts under a prefix (npm_/pypi_/
  rubygems_) → nested `registries.<id>`; one call may carry several registries. Empties
  dropped. `pr_list` (x1f) and `notes` (base64) are JSON-escaped, so entries splice into
  a JSON array via GitHub expression interpolation with no further shell/jq.

inputs:
  label:
    description: "Display label for notifications (defaults, downstream, to a registry name / tag)"
    required: false
    default: ''
  emoji:
    description: "Presentation emoji for notifications"
    required: false
    default: ''
  tag:
    description: "Release tag (e.g. js-1.2.3)"
    required: false
    default: ''
  prev_release:
    description: "Previous release tag (for the diff link)"
    required: false
    default: ''
  pr_list:
    description: "x1f-delimited PR list (from prepare)"
    required: false
    default: ''
  notes:
    description: "Base64-encoded release notes (from prepare)"
    required: false
    default: ''
  github_release:
    description: "Whether a GitHub release should be created for this package"
    required: false
    default: ''
  npm_name:
    description: "npm: package name (presence adds an npm registry entry)"
    required: false
    default: ''
  npm_version:
    description: "npm: version"
    required: false
    default: ''
  npm_channel:
    description: "npm: dist-tag / channel"
    required: false
    default: ''
  npm_version_url:
    description: "npm: human URL for the version (from validate/configure)"
    required: false
    default: ''
  npm_already_published:
    description: "npm: 'true'/'false' — is this version already on npm"
    required: false
    default: ''
  pypi_name:
    description: "PyPI: package name (presence adds a pypi registry entry)"
    required: false
    default: ''
  pypi_version:
    description: "PyPI: version"
    required: false
    default: ''
  pypi_version_url:
    description: "PyPI: human URL for the version"
    required: false
    default: ''
  pypi_already_published:
    description: "PyPI: 'true'/'false' — is this version already on PyPI"
    required: false
    default: ''
  rubygems_name:
    description: "RubyGems: gem name (presence adds a rubygems registry entry)"
    required: false
    default: ''
  rubygems_version:
    description: "RubyGems: version"
    required: false
    default: ''
  rubygems_version_url:
    description: "RubyGems: human URL for the version"
    required: false
    default: ''
  rubygems_already_published:
    description: "RubyGems: 'true'/'false' — is this version already on RubyGems"
    required: false
    default: ''

outputs:
  package:
    description: "One package manifest entry as compact JSON (only the provided fields)"
    value: ${{ steps.build.outputs.package }}

runs:
  using: composite
  steps:
    - name: Build package manifest entry
      id: build
      shell: bash
      env:
        LABEL: "${{ inputs.label }}"
        EMOJI: "${{ inputs.emoji }}"
        TAG: "${{ inputs.tag }}"
        PREV_RELEASE: "${{ inputs.prev_release }}"
        PR_LIST: "${{ inputs.pr_list }}"
        NOTES: "${{ inputs.notes }}"
        GITHUB_RELEASE: "${{ inputs.github_release }}"
        NPM_NAME: "${{ inputs.npm_name }}"
        NPM_VERSION: "${{ inputs.npm_version }}"
        NPM_CHANNEL: "${{ inputs.npm_channel }}"
        NPM_VERSION_URL: "${{ inputs.npm_version_url }}"
        NPM_ALREADY_PUBLISHED: "${{ inputs.npm_already_published }}"
        PYPI_NAME: "${{ inputs.pypi_name }}"
        PYPI_VERSION: "${{ inputs.pypi_version }}"
        PYPI_VERSION_URL: "${{ inputs.pypi_version_url }}"
        PYPI_ALREADY_PUBLISHED: "${{ inputs.pypi_already_published }}"
        RUBYGEMS_NAME: "${{ inputs.rubygems_name }}"
        RUBYGEMS_VERSION: "${{ inputs.rubygems_version }}"
        RUBYGEMS_VERSION_URL: "${{ inputs.rubygems_version_url }}"
        RUBYGEMS_ALREADY_PUBLISHED: "${{ inputs.rubygems_already_published }}"
      run: |
        set -euo pipefail
        if ! command -v jq >/dev/null 2>&1; then
          echo "::error title=jq not found::build-manifest requires jq."
          exit 1
        fi

        REGISTRIES='{}'
        # Add one registry entry (keyed by id) when its name/version are given. version_url is
        # carried in (from the availability check); empties dropped; already_published → boolean.
        add_registry() {
          local reg="$1" name="$2" version="$3" channel="$4" ap="$5" url="$6"
          { [ -z "$name" ] && [ -z "$version" ]; } && return 0
          local entry
          entry="$(jq -nc \
            --arg name "$name" --arg version "$version" --arg url "$url" \
            --arg channel "$channel" --arg ap "$ap" \
            '{name:$name, version:$version, version_url:$url, channel:$channel}
             | with_entries(select(.value != ""))
             | if $ap=="true" then .already_published=true
               elif $ap=="false" then .already_published=false else . end')"
          REGISTRIES="$(jq -c --arg r "$reg" --argjson e "$entry" '. + {($r): $e}' <<<"$REGISTRIES")"
        }
        add_registry npm      "$NPM_NAME"      "$NPM_VERSION"      "$NPM_CHANNEL" "$NPM_ALREADY_PUBLISHED"      "$NPM_VERSION_URL"
        add_registry pypi     "$PYPI_NAME"     "$PYPI_VERSION"     ""            "$PYPI_ALREADY_PUBLISHED"     "$PYPI_VERSION_URL"
        add_registry rubygems "$RUBYGEMS_NAME" "$RUBYGEMS_VERSION" ""            "$RUBYGEMS_ALREADY_PUBLISHED" "$RUBYGEMS_VERSION_URL"

        # Package-level object; drop empties, then attach registries only when non-empty.
        PACKAGE="$(jq -nc \
          --arg label "$LABEL" --arg emoji "$EMOJI" --arg tag "$TAG" \
          --arg prev_release "$PREV_RELEASE" --arg pr_list "$PR_LIST" --arg notes "$NOTES" \
          --arg github_release "$GITHUB_RELEASE" \
          '{label:$label, emoji:$emoji, tag:$tag, prev_release:$prev_release,
            pr_list:$pr_list, notes:$notes, github_release:$github_release}
           | with_entries(select(.value != ""))')"
        if [ "$REGISTRIES" != "{}" ]; then
          PACKAGE="$(jq -c --argjson r "$REGISTRIES" '. + {registries:$r}' <<<"$PACKAGE")"
        fi

        echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
        echo "Built package manifest entry: $(jq -c '{keys:keys, registries:(.registries // {} | keys)}' <<<"$PACKAGE")"
