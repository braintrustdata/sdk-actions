name: Release

# Releases bt-publishing-test to PyPI via braintrustdata/sdk-actions, custom-build shape:
# an unprivileged `pack` job builds + attests dist/ (wheel + sdist) with no publish creds
# and uploads it; a gated `ship-package` job verifies the attestation and publishes THOSE
# exact dists. Dispatch after merging the commit that bumps VERSION in src/bt_publishing_test/version.py.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (stable → GitHub release; prerelease → none)"
        type: choice
        default: stable
        options: [stable, prerelease]
      sha:
        description: "Commit SHA (of the version bump) to release"
        required: true
        type: string
      prev_release:
        description: "Release-notes anchor: a tag or SHA (empty → the previous tag)"
        type: string
        required: false
      dry_run:
        description: "Dry run: build + pack without attesting or publishing"
        type: boolean
        default: false

jobs:
  # FACT-FIND — derive version/tag/notes, check the registry, and emit the package manifest.
  # contents: write is for the releases/generate-notes API.
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.configure.outputs.version }}
      release_tag: ${{ steps.configure.outputs.release_tag }}
      prev_release: ${{ steps.configure.outputs.prev_release }}
      branch: ${{ steps.configure.outputs.branch }}
      on_release_branch: ${{ steps.configure.outputs.on_release_branch }}
      commit_message: ${{ steps.configure.outputs.commit_message }}
      github_release: ${{ steps.configure.outputs.github_release }}
      already_published: ${{ steps.configure.outputs.already_published }}
      notes: ${{ steps.configure.outputs.notes }}
      package: ${{ steps.configure.outputs.package }}
    steps:
      - name: Configure release
        id: configure
        uses: braintrustdata/sdk-actions/actions/release/lang/py/configure@38dcec863c910f6802c03a94ab9aeb79931a0a3a
        with:
          version_file: src/bt_publishing_test/version.py
          sha: ${{ inputs.sha }}
          working_directory: .
          release_type: ${{ inputs.release_type }}
          pypi_package_name: bt-publishing-test
          package_label: bt-publishing-test
          emoji: ':python:'
          prev_release: ${{ inputs.prev_release }}

  validate:
    needs: [configure]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate release
        uses: braintrustdata/sdk-actions/actions/release/lang/py/validate@38dcec863c910f6802c03a94ab9aeb79931a0a3a
        with:
          sha: ${{ inputs.sha }}
          dry_run: ${{ inputs.dry_run }}
          working_directory: .
          python_version: .python-version
          release_tag: ${{ needs.configure.outputs.release_tag }}
          on_release_branch: ${{ needs.configure.outputs.on_release_branch }}
          notes: ${{ needs.configure.outputs.notes }}
          already_published: ${{ needs.configure.outputs.already_published }}
          build: 'false'   # the pack job owns the build
          sbom: 'false'    # the pack job generates + attests the SBOM

  # BUILD side — unprivileged: builds + attests dist/, NO publish credentials.
  pack:
    needs: [configure, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Pack + attest
        uses: braintrustdata/sdk-actions/actions/release/lang/py/pack@38dcec863c910f6802c03a94ab9aeb79931a0a3a
        with:
          sha: ${{ inputs.sha }}
          working_directory: .
          python_version: .python-version
          dry_run: ${{ inputs.dry_run }}

      - name: Stage artifact
        run: |
          mkdir -p artifact/dist
          cp ./dist/*.whl ./dist/*.tar.gz artifact/dist/
          cp ./sbom.json artifact/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: artifact/
          retention-days: 1
          if-no-files-found: error

  request-approval:
    needs: [configure, validate, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Request release approval
        uses: braintrustdata/sdk-actions/actions/release/request-approval@38dcec863c910f6802c03a94ab9aeb79931a0a3a
        with:
          packages: '{"packages":[${{ needs.configure.outputs.package }}]}'
          sha: ${{ inputs.sha }}
          branch: ${{ needs.configure.outputs.branch }}
          on_release_branch: ${{ needs.configure.outputs.on_release_branch }}
          commit_message: ${{ needs.configure.outputs.commit_message }}
          dry_run: ${{ inputs.dry_run }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: ${{ vars.SLACK_SDK_RELEASE_CHANNEL }}

  # PUBLISH side — gated: verifies the attestation against the downloaded dists, then publishes them.
  ship-package:
    needs: [configure, validate, pack, request-approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.dry_run && 'publish-dry-run' || 'publish' }}
    permissions:
      contents: write
      id-token: write     # OIDC trusted publishing + PEP 740
      attestations: read  # gh attestation verify
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: dl

      - name: Ship package
        uses: braintrustdata/sdk-actions/actions/release/lang/py/ship-package@38dcec863c910f6802c03a94ab9aeb79931a0a3a
        with:
          working_directory: dl   # holds dist/ (whl + sdist) + sbom.json
          sha: ${{ inputs.sha }}
          dry_run: ${{ inputs.dry_run }}
          release_tag: ${{ needs.configure.outputs.release_tag }}
          already_published: ${{ needs.configure.outputs.already_published }}
          github_release: ${{ needs.configure.outputs.github_release }}
          version: ${{ needs.configure.outputs.version }}
          package_name: bt-publishing-test
          label: bt-publishing-test
          notes: ${{ needs.configure.outputs.notes }}
          prev_release: ${{ needs.configure.outputs.prev_release }}
          branch: ${{ needs.configure.outputs.branch }}
          on_release_branch: ${{ needs.configure.outputs.on_release_branch }}
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: ${{ vars.SLACK_SDK_RELEASE_CHANNEL }}
          emoji: ':python:'
