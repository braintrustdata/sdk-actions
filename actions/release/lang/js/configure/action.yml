# GENERATED by scripts/generate.rb — edit templates/, not this file.
# sdk-actions: {"family":"release","version":"1.0.0"}
name: Configure JavaScript Release
description: >
  Produces the release FACTS for a JavaScript package — the fact-finding half of the
  pipeline (validate judges these; it never fails on release state). Checks out the SHA,
  sets up Node, reads the version, computes the release tag/branch/commit/channel/
  github_release, checks npm for whether the version is already published (→
  already_published + version_url), fetches release notes + PR list, and assembles the
  package manifest. Requires contents: write on the calling job (for the generate-notes
  API). Its outputs (incl. `package`) feed validate, request-approval, and ship.

inputs:
  sha:
    description: "Commit SHA being released"
    required: true
  version:
    description: >
      Explicit version override. If provided, the version is not read from package.json.
      Use when the version is computed externally (e.g. a run-number auto-bump).
    required: false
    default: ''
  working_directory:
    description: "Path to the package root (where package.json lives)"
    required: false
    default: '.'
  tag_format:
    description: "Git tag format, with a {version} placeholder (e.g. js-{version})"
    required: false
    default: 'v{version}'
  release_type:
    description: >
      'stable' | 'prerelease'. Maps to the channel + github_release defaults
      (prerelease → channel 'rc', no GitHub release). Explicit channel/github_release
      inputs override this.
    required: false
    default: 'stable'
  npm_channel:
    description: "Explicit npm channel (dist-tag) override. Empty → derived from release_type."
    required: false
    default: ''
  github_release:
    description: "Explicit github_release override ('true'/'false'). Empty → derived from release_type."
    required: false
    default: ''
  release_branch:
    description: "Comma-separated allowed release branch patterns (globs)."
    required: false
    default: 'main'
  npm_registry:
    description: "npm registry URL (for the availability check)."
    required: false
    default: 'https://registry.npmjs.org'
  npm_package_name:
    description: "npm package name. Enables the availability check + the manifest's npm registry entry."
    required: false
    default: ''
  package_label:
    description: "Display label raw material for notifications (presentation-agnostic; the renderer formats it)."
    required: false
    default: ''
  emoji:
    description: "Presentation emoji raw material for notifications."
    required: false
    default: ''
  prev_release:
    description: "Release-notes anchor override (tag or SHA). Empty → configure's derived previous tag."
    required: false
    default: ''

outputs:
  version:
    description: "The resolved package version"
    value: ${{ steps.read-version.outputs.version }}
  release_tag:
    description: "The release tag (e.g. v0.3.2)"
    value: ${{ steps.configure.outputs.release_tag }}
  prev_release:
    description: "The previous release tag"
    value: ${{ steps.configure.outputs.prev_release }}
  branch:
    description: "The branch containing the SHA"
    value: ${{ steps.configure.outputs.branch }}
  on_release_branch:
    description: "Whether the SHA is on an allowed release branch"
    value: ${{ steps.configure.outputs.on_release_branch }}
  commit_message:
    description: "The commit message at the SHA"
    value: ${{ steps.configure.outputs.commit_message }}
  channel:
    description: "The resolved npm channel (dist-tag)"
    value: ${{ steps.configure.outputs.channel }}
  github_release:
    description: "Whether a GitHub release should be created"
    value: ${{ steps.configure.outputs.github_release }}
  already_published:
    description: "Whether the version is already published to npm"
    value: ${{ steps.version-check.outputs.already_published }}
  version_url:
    description: "Human URL for the version on npm"
    value: ${{ steps.version-check.outputs.version_url }}
  pr_list:
    description: "Formatted PR list (x1f-delimited)"
    value: ${{ steps.fetch.outputs.pr_list }}
  notes:
    description: "Base64-encoded release notes"
    value: ${{ steps.fetch.outputs.notes }}
  package:
    description: "A JSON object describing the package to be published."
    value: ${{ steps.build.outputs.package }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ inputs.sha }}
        fetch-depth: 0

    # Read-only version read: any Node reads package.json; the project's pinned toolchain
    # is only needed to BUILD (validate / ship). Safe in strict-pnpm repos. No pnpm/install.
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 'lts/*'

    - name: Read version
      id: read-version
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        VERSION_OVERRIDE: ${{ inputs.version }}
      run: |
        if [ -n "$VERSION_OVERRIDE" ]; then
          VERSION="$VERSION_OVERRIDE"
        else
          VERSION=$(node -p "require('./package.json').version")
        fi
        if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
          echo "::error title=Could not read version::resolved an empty version — check the \"version\" field in package.json (or pass a version override)."
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Validate SHA format
      shell: bash
      env:
        SHA: ${{ inputs.sha }}
      run: |
        if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
          echo "::error title=Invalid release SHA::sha must be a full 40-character commit SHA — branch names and short SHAs are not accepted."
          exit 1
        fi

    - name: Configure release
      id: configure
      shell: bash
      env:
        VERSION: ${{ steps.read-version.outputs.version }}
        TAG_FORMAT: ${{ inputs.tag_format }}
        RELEASE_BRANCH: ${{ inputs.release_branch }}
        RELEASE_TYPE: ${{ inputs.release_type }}
        # Quoted: these overrides are legitimately empty (e.g. py/ruby have no channel), and an
        # unquoted empty value would parse as YAML null, which the action schema rejects.
        CHANNEL_OVERRIDE: "${{ inputs.npm_channel }}"
        GHR_OVERRIDE: "${{ inputs.github_release }}"
      run: |
        TAG="${TAG_FORMAT//\{version\}/$VERSION}"
        COMMIT_MSG=$(git log -1 --format="%s" HEAD)
        BRANCH=$(git branch -r --contains HEAD --format="%(refname:short)" | sed 's|origin/||' | head -1)

        ON_RELEASE_BRANCH=false
        IFS=',' read -ra PATTERNS <<< "$RELEASE_BRANCH"
        for pattern in "${PATTERNS[@]}"; do
          pattern=$(echo "$pattern" | xargs)
          if [[ "$BRANCH" == $pattern ]]; then ON_RELEASE_BRANCH=true; break; fi
        done

        PREV_RELEASE_PATTERN="${TAG_FORMAT//\{version\}/[0-9]*.[0-9]*.[0-9]*}"
        PREV_RELEASE=$(git describe --tags --abbrev=0 --match="$PREV_RELEASE_PATTERN" HEAD^ 2>/dev/null || echo "")

        # channel: explicit override wins; else map from release_type (prerelease→rc, stable→latest)
        if [ -n "$CHANNEL_OVERRIDE" ]; then CHANNEL="$CHANNEL_OVERRIDE"
        elif [ "$RELEASE_TYPE" = "prerelease" ]; then CHANNEL="rc"
        else CHANNEL="latest"; fi

        # github_release: explicit override wins; else prerelease→false, stable→true
        if [ -n "$GHR_OVERRIDE" ]; then GHR="$GHR_OVERRIDE"
        elif [ "$RELEASE_TYPE" = "prerelease" ]; then GHR="false"
        else GHR="true"; fi

        {
          echo "release_tag=$TAG"
          echo "commit_message=$COMMIT_MSG"
          echo "branch=$BRANCH"
          echo "on_release_branch=$ON_RELEASE_BRANCH"
          echo "prev_release=$PREV_RELEASE"
          echo "channel=$CHANNEL"
          echo "github_release=$GHR"
        } >> "$GITHUB_OUTPUT"
        echo "Configured $TAG @ $VERSION (channel=$CHANNEL, github_release=$GHR, branch=$BRANCH, on_release_branch=$ON_RELEASE_BRANCH)"

    - name: Check npm version availability
      id: version-check
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.npm_package_name }}
        VERSION: ${{ steps.read-version.outputs.version }}
        REGISTRY: ${{ inputs.npm_registry }}
        SEVERITY: off
      run: |
        if [ -z "$PACKAGE_NAME" ]; then
          echo "No package_name provided; skipping npm availability check."
          exit 0
        fi
        echo "version_url=https://www.npmjs.com/package/$PACKAGE_NAME/v/$VERSION" >> "$GITHUB_OUTPUT"
        REGISTRY="${REGISTRY%/}"
        CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
          --retry 3 --retry-connrefused --max-time 30 \
          "$REGISTRY/$PACKAGE_NAME/$VERSION")
        case "$CODE" in
          200)
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            if [ "$SEVERITY" = "off" ]; then
              echo "$PACKAGE_NAME@$VERSION is already on npm."
            elif [ "$SEVERITY" = "warn" ]; then
              echo "::warning title=Already published::$PACKAGE_NAME@$VERSION is already on npm."
            else
              echo "::error title=Version already published::$PACKAGE_NAME@$VERSION already exists on npm — has the version been bumped?"
              exit 1
            fi
            ;;
          404)
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$VERSION is available on npm."
            ;;
          *)
            echo "::error title=Registry check failed::unexpected response from the npm registry (HTTP $CODE) checking $PACKAGE_NAME@$VERSION — cannot confirm the version is unpublished; aborting rather than risk a bad release."
            exit 1
            ;;
        esac

    - name: Fetch PR list and release notes
      id: fetch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.configure.outputs.release_tag }}
        SHA: ${{ inputs.sha }}
        PREV_RELEASE: ${{ inputs.prev_release || steps.configure.outputs.prev_release }}
      run: |
        # If prev_release is a full SHA, notes are unavailable.
        if echo "$PREV_RELEASE" | grep -qE '^[0-9a-f]{40}$'; then
          echo "SHA provided for prev_release — notes unavailable for SHA ranges."
          echo "pr_list=" >> $GITHUB_OUTPUT
          echo "notes=$(echo "" | base64 -w 0)" >> $GITHUB_OUTPUT
          exit 0
        fi

        BODY=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
          --method POST \
          --field tag_name="$RELEASE_TAG" \
          --field target_commitish="$SHA" \
          ${PREV_RELEASE:+--field previous_tag_name="$PREV_RELEASE"} \
          --jq '.body' 2>/dev/null || echo "")

        PR_LIST=$(echo "$BODY" \
          | grep "^\* " \
          | grep -v "made their first contribution" \
          | grep -v "Full Changelog" \
          | head -10 \
          | sed 's|^\* ||' \
          | sed 's| by @[^ ]*||' \
          | sed 's@ in \(https://[^ ]*/pull/\([0-9]*\)\)@ (<\1|#\2>)@' \
          | sed 's/^/• /' \
          | tr '\n' $'\x1f' || echo "")

        echo "pr_list=$PR_LIST" >> $GITHUB_OUTPUT
        echo "notes=$(echo "$BODY" | base64 -w 0)" >> $GITHUB_OUTPUT

    - name: Build package manifest entry
      id: build
      shell: bash
      env:
        LABEL: "${{ inputs.package_label }}"
        EMOJI: "${{ inputs.emoji }}"
        TAG: "${{ steps.configure.outputs.release_tag }}"
        PREV_RELEASE: "${{ inputs.prev_release || steps.configure.outputs.prev_release }}"
        PR_LIST: "${{ steps.fetch.outputs.pr_list }}"
        NOTES: "${{ steps.fetch.outputs.notes }}"
        GITHUB_RELEASE: "${{ steps.configure.outputs.github_release }}"
        NPM_NAME: "${{ inputs.npm_package_name }}"
        NPM_VERSION: "${{ steps.read-version.outputs.version }}"
        NPM_CHANNEL: "${{ steps.configure.outputs.channel }}"
        NPM_VERSION_URL: "${{ steps.version-check.outputs.version_url }}"
        NPM_ALREADY_PUBLISHED: "${{ steps.version-check.outputs.already_published }}"
        PYPI_NAME: ""
        PYPI_VERSION: ""
        PYPI_VERSION_URL: ""
        PYPI_ALREADY_PUBLISHED: ""
        RUBYGEMS_NAME: ""
        RUBYGEMS_VERSION: ""
        RUBYGEMS_VERSION_URL: ""
        RUBYGEMS_ALREADY_PUBLISHED: ""
      run: |
        set -euo pipefail
        if ! command -v jq >/dev/null 2>&1; then
          echo "::error title=jq not found::build-manifest requires jq."
          exit 1
        fi

        REGISTRIES='{}'
        # Add one registry entry (keyed by id) when its name/version are given. version_url is
        # carried in (from the availability check); empties dropped; already_published → boolean.
        add_registry() {
          local reg="$1" name="$2" version="$3" channel="$4" ap="$5" url="$6"
          { [ -z "$name" ] && [ -z "$version" ]; } && return 0
          local entry
          entry="$(jq -nc \
            --arg name "$name" --arg version "$version" --arg url "$url" \
            --arg channel "$channel" --arg ap "$ap" \
            '{name:$name, version:$version, version_url:$url, channel:$channel}
             | with_entries(select(.value != ""))
             | if $ap=="true" then .already_published=true
               elif $ap=="false" then .already_published=false else . end')"
          REGISTRIES="$(jq -c --arg r "$reg" --argjson e "$entry" '. + {($r): $e}' <<<"$REGISTRIES")"
        }
        add_registry npm      "$NPM_NAME"      "$NPM_VERSION"      "$NPM_CHANNEL" "$NPM_ALREADY_PUBLISHED"      "$NPM_VERSION_URL"
        add_registry pypi     "$PYPI_NAME"     "$PYPI_VERSION"     ""            "$PYPI_ALREADY_PUBLISHED"     "$PYPI_VERSION_URL"
        add_registry rubygems "$RUBYGEMS_NAME" "$RUBYGEMS_VERSION" ""            "$RUBYGEMS_ALREADY_PUBLISHED" "$RUBYGEMS_VERSION_URL"

        # Package-level object; drop empties, then attach registries only when non-empty.
        PACKAGE="$(jq -nc \
          --arg label "$LABEL" --arg emoji "$EMOJI" --arg tag "$TAG" \
          --arg prev_release "$PREV_RELEASE" --arg pr_list "$PR_LIST" --arg notes "$NOTES" \
          --arg github_release "$GITHUB_RELEASE" \
          '{label:$label, emoji:$emoji, tag:$tag, prev_release:$prev_release,
            pr_list:$pr_list, notes:$notes, github_release:$github_release}
           | with_entries(select(.value != ""))')"
        if [ "$REGISTRIES" != "{}" ]; then
          PACKAGE="$(jq -c --argjson r "$REGISTRIES" '. + {registries:$r}' <<<"$PACKAGE")"
        fi

        echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
        echo "Built package manifest entry: $(jq -c '{keys:keys, registries:(.registries // {} | keys)}' <<<"$PACKAGE")"

    - name: Dump JavaScript environment
      if: ${{ failure() }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        echo "=== Node environment ==="
        node --version
        npm --version
        echo "=== pnpm ==="
        pnpm --version || echo "(unavailable)"
        echo "=== package.json ==="
        node -e '
          const p = require("./package.json");
          console.log(JSON.stringify({
            name: p.name,
            version: p.version,
            private: p.private || false,
            packageManager: p.packageManager,
            engines: p.engines,
            devEngines: p.devEngines,
            publishConfig: p.publishConfig,
            lifecycle: Object.fromEntries(
              ["prepublishOnly", "prepack", "prepare", "postpack"]
                .filter((k) => p.scripts && p.scripts[k])
                .map((k) => [k, p.scripts[k]]),
            ),
          }, null, 2));
        ' 2>/dev/null || echo "(package.json unavailable)"
